<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>24 Xpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#F1F1EC; --surface:#FFFFFF; --surface-2:#E9E9E3; --border:#DAD9D2;
    --ink:#1B2024; --ink-soft:#5B6067; --ink-faint:#8A8F94;
    --accent:#2E6F91; --accent-ink:#FFFFFF; --accent-soft:#DCEAF1; --accent-soft-ink:#1D4D66;
    --ok:#3F9463; --ok-soft:#DFF0E6; --ok-ink:#1F5E3C;
    --warn:#B5731A; --warn-soft:#F6E6CF; --warn-ink:#7A4B0E;
    --critical:#C1392B; --critical-soft:#F6DCD8; --critical-ink:#8A281D;
    --shadow:0 8px 24px rgba(27,32,36,.10), 0 2px 6px rgba(27,32,36,.06);
    --shell-max:440px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171A; --surface:#1D2226; --surface-2:#262B30; --border:#333940;
      --ink:#ECEDEE; --ink-soft:#A8AEB4; --ink-faint:#767D84;
      --accent:#68ABCB; --accent-ink:#0E1418; --accent-soft:#223640; --accent-soft-ink:#AFDCF0;
      --ok:#5CB584; --ok-soft:#1E3327; --ok-ink:#A9E0C0;
      --warn:#E0A344; --warn-soft:#3A2C15; --warn-ink:#F0C888;
      --critical:#E1665A; --critical-soft:#3B211E; --critical-ink:#F3AFA7;
      --shadow:0 10px 28px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171A; --surface:#1D2226; --surface-2:#262B30; --border:#333940;
    --ink:#ECEDEE; --ink-soft:#A8AEB4; --ink-faint:#767D84;
    --accent:#68ABCB; --accent-ink:#0E1418; --accent-soft:#223640; --accent-soft-ink:#AFDCF0;
    --ok:#5CB584; --ok-soft:#1E3327; --ok-ink:#A9E0C0;
    --warn:#E0A344; --warn-soft:#3A2C15; --warn-ink:#F0C888;
    --critical:#E1665A; --critical-soft:#3B211E; --critical-ink:#F3AFA7;
    --shadow:0 10px 28px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  .num{font-family:"JetBrains Mono","Noto Sans SC",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}

  #shell{
    max-width:var(--shell-max);
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex; flex-direction:column;
    position:relative;
  }
  @media (min-width:640px){
    body{padding:28px 12px;}
    #shell{
      min-height:calc(100vh - 56px);
      border-radius:26px;
      box-shadow:var(--shadow);
      overflow:hidden;
      border:1px solid var(--border);
    }
  }

  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
    padding:16px 18px 12px;
    background:var(--paper);
    position:sticky; top:0; z-index:20;
  }
  #topbar .brand{display:flex; flex-direction:column; gap:1px; min-width:0;}
  #topbar .brand-row{display:flex; align-items:center; gap:7px;}
  #topbar .logo-badge{
    flex-shrink:0; height:26px; width:auto; display:block;
  }
  #topbar .brand .name{font-weight:900; font-size:16px; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #topbar .brand .date{font-size:11.5px; color:var(--ink-faint); font-family:"JetBrains Mono",monospace;}
  #topbar .side{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  #topbar .langbtn{
    flex-shrink:0; min-width:30px; height:30px; padding:0 9px; border-radius:999px;
    background:var(--surface); border:1px solid var(--border); color:var(--ink-soft);
    font-weight:700; font-size:11.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #topbar .notifbtn{position:relative; width:30px; padding:0;}
  #topbar .notifbtn svg{width:16px; height:16px;}
  .notif-badge{
    position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px;
    border-radius:999px; background:var(--critical); color:#fff; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace;
  }
  .notif-row{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .notif-row:last-child{border-bottom:none;}
  .notif-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:6px;}
  .notif-dot.seen{background:transparent; border:1px solid var(--border);}
  .memo-body{white-space:pre-wrap; line-height:1.65; font-size:14px; margin:10px 0;}
  #topbar .who{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:5px 12px 5px 5px;
    cursor:pointer;
  }
  #topbar .who .avatar{
    width:26px; height:26px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:12px; flex-shrink:0;
  }
  #topbar .who .meta{display:flex; flex-direction:column; line-height:1.2;}
  #topbar .who .meta .n{font-size:12.5px; font-weight:700; max-width:84px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #topbar .who .meta .r{font-size:10.5px; color:var(--ink-faint);}

  #view{flex:1; padding:2px 16px 100px; overflow-y:auto;}
  h1.sec, h2.sec{
    font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); margin:22px 0 10px;
  }
  h1.sec:first-child, h2.sec:first-child{margin-top:6px;}
  .sec-row{display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px;}
  .sec-row h2.sec{margin:0;}
  .sec-link{font-size:12.5px; color:var(--accent); font-weight:700; cursor:pointer; background:none; border:none; padding:0;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}

  .tile{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px;
  }
  .tile .tv{font-size:24px; font-weight:900; font-family:"JetBrains Mono",monospace;}
  .tile .tl{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .tile.warn .tv{color:var(--warn);}
  .tile.critical .tv{color:var(--critical);}
  .tile.ok .tv{color:var(--ok);}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:12px;
  }
  .card-tight{padding:12px 14px;}

  .row{display:flex; align-items:center; gap:12px;}
  .row + .row{margin-top:10px;}
  .list{display:flex; flex-direction:column; gap:8px;}
  .list-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 13px; cursor:pointer;
  }
  .list-row:active{background:var(--surface-2);}
  .list-row .lr-main{flex:1; min-width:0;}
  .list-row .lr-title{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .list-row .lr-sub{font-size:12px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .list-row .lr-end{text-align:right; flex-shrink:0;}
  .lr-thumb{width:38px; height:38px; border-radius:9px; object-fit:cover; flex-shrink:0; background:var(--surface-2);}

  .pill{
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;
    white-space:nowrap;
  }
  .pill.n{background:var(--surface-2); color:var(--ink-soft);}
  .pill.ok{background:var(--ok-soft); color:var(--ok-ink);}
  .pill.warn{background:var(--warn-soft); color:var(--warn-ink);}
  .pill.critical{background:var(--critical-soft); color:var(--critical-ink);}
  .pill.accent{background:var(--accent-soft); color:var(--accent-soft-ink);}
  .pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .icon-sm svg{width:16px; height:16px; display:block;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:11px; padding:10px 16px; font-weight:700; font-size:13.5px;
    cursor:pointer; user-select:none;
  }
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--accent); padding:8px 4px;}
  .btn.danger{background:var(--critical-soft); border-color:var(--critical-soft); color:var(--critical-ink);}
  .btn.ok{background:var(--ok-soft); border-color:var(--ok-soft); color:var(--ok-ink);}
  .btn.block{width:100%;}
  .btn.sm{padding:6px 11px; font-size:12px; border-radius:9px;}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn svg{width:16px; height:16px;}

  .clockbtn{
    width:168px; height:168px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink);
    border:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; margin:14px auto 6px; cursor:pointer; box-shadow:var(--shadow);
  }
  .clockbtn.out{background:var(--ink); color:var(--paper);}
  .clockbtn .t{font-size:17px; font-weight:900;}
  .clockbtn .s{font-size:20px; font-weight:900; font-family:"JetBrains Mono",monospace;}
  .clockbtn:disabled{opacity:.55;}

  input[type=text], input[type=number], input[type=date], input[type=time], input[type=tel], input[type=password], select, textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    border-radius:10px; padding:10px 12px; font-size:14px; outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical; min-height:64px;}
  label.field{display:block; margin-bottom:12px;}
  label.field .fl{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .seg{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .seg button{flex:1; padding:9px; background:var(--surface-2); border:none; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer; border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--accent); color:var(--accent-ink);}
  .chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:2px;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:7px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .chip.on{background:var(--ink); border-color:var(--ink); color:var(--paper);}

  .empty{text-align:center; padding:34px 16px; color:var(--ink-faint); font-size:13px;}
  .empty svg{width:34px; height:34px; margin-bottom:8px; opacity:.5;}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:8px; line-height:1.6;}
  .divider{height:1px; background:var(--border); margin:18px 0;}

  #nav{
    position:sticky; bottom:0; z-index:20;
    display:flex; background:var(--surface); border-top:1px solid var(--border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  #nav button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:7px 2px; cursor:pointer; color:var(--ink-faint);
  }
  #nav button svg{width:21px; height:21px;}
  #nav button .lb{font-size:10.5px; font-weight:700;}
  #nav button.on{color:var(--accent);}
  .ib{display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:12px; flex-shrink:0;}
  .ib svg{width:20px; height:20px;}
  .ib.lg{width:50px; height:50px; border-radius:15px;} .ib.lg svg{width:25px; height:25px;}
  .ib.sm{width:26px; height:26px; border-radius:8px;} .ib.sm svg{width:15px; height:15px;}
  .sec .ib.sm{margin-right:8px; vertical-align:-7px;}
  .list-row>.ib{margin-right:2px;}
  .c-blue{background:rgba(47,111,163,.14); color:#2F6FA3;} .c-green{background:rgba(11,110,79,.14); color:#0B6E4F;} .c-teal{background:rgba(14,116,144,.14); color:#0E7490;}
  .c-orange{background:rgba(200,90,20,.14); color:#C85A14;} .c-red{background:rgba(190,38,30,.14); color:#BE261E;} .c-purple{background:rgba(91,62,147,.14); color:#5B3E93;}
  .c-amber{background:rgba(176,116,0,.16); color:#8A5A00;} .c-grey{background:rgba(120,128,136,.16); color:var(--ink-soft);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .c-blue{color:#8FC1EA;} :root:not([data-theme="light"]) .c-green{color:#5FCFA0;} :root:not([data-theme="light"]) .c-teal{color:#5FD3E6;} :root:not([data-theme="light"]) .c-orange{color:#F2A26B;} :root:not([data-theme="light"]) .c-red{color:#F08C84;} :root:not([data-theme="light"]) .c-purple{color:#C4A9F0;} :root:not([data-theme="light"]) .c-amber{color:#F0C15A;} }
  :root[data-theme="dark"] .c-blue{color:#8FC1EA;} :root[data-theme="dark"] .c-green{color:#5FCFA0;} :root[data-theme="dark"] .c-teal{color:#5FD3E6;} :root[data-theme="dark"] .c-orange{color:#F2A26B;} :root[data-theme="dark"] .c-red{color:#F08C84;} :root[data-theme="dark"] .c-purple{color:#C4A9F0;} :root[data-theme="dark"] .c-amber{color:#F0C15A;}
  .hello{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:18px; background:linear-gradient(135deg, var(--accent) 0%, #1F5F8B 100%); color:#fff; margin-top:2px; box-shadow:0 8px 22px rgba(31,95,139,.22);}
  .hello .av{width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:18px; flex-shrink:0;}
  .hello .g{font-size:16px; font-weight:900; line-height:1.3;} .hello .s{font-size:12.5px; opacity:.92; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px 6px; margin-top:6px;}
  .ftile{display:flex; flex-direction:column; align-items:center; gap:7px; background:transparent; border:0; padding:6px 2px; cursor:pointer; color:var(--ink); font:inherit; -webkit-tap-highlight-color:transparent;}
  .ftile:active .ib{transform:scale(.94);} .ftile .ib{transition:transform .12s;}
  .ftile .lb{font-size:11.5px; font-weight:700; line-height:1.2; text-align:center;}
  .ftile .bd{position:relative;}
  .ftile .cnt{position:absolute; top:-5px; right:-7px; min-width:18px; height:18px; border-radius:9px; background:var(--critical); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 5px; border:2px solid var(--paper);}
  .weekgrid{border-collapse:collapse; min-width:560px; font-size:12px; width:100%;}
  .weekgrid th,.weekgrid td{border-bottom:1px solid var(--line); padding:6px 4px; text-align:center; vertical-align:middle;}
  .weekgrid th{font-size:11px; color:var(--ink-soft); font-weight:700; line-height:1.3;}
  .weekgrid th.today{color:var(--accent);}
  .weekgrid td.nm{text-align:left; font-weight:700; white-space:nowrap; max-width:120px; overflow:hidden; text-overflow:ellipsis; position:sticky; left:0; background:inherit; padding-left:10px;}
  .weekgrid td{cursor:pointer; min-width:62px;}
  .weekgrid td.has{background:var(--accent-soft);}
  .weekgrid .sh{display:block; font-size:11px; font-weight:800;}
  .weekgrid .plus{color:var(--ink-faint); font-size:14px;}

  #modalWrap{position:fixed; inset:0; z-index:100; display:none;}
  #modalWrap.show{display:block;}
  #modalWrap .backdrop{position:absolute; inset:0; background:rgba(10,12,14,.5);}
  #modalWrap .sheet{
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:100%; max-width:var(--shell-max);
    background:var(--surface); border-radius:20px 20px 0 0;
    max-height:88vh; overflow-y:auto; padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 30px rgba(0,0,0,.25);
  }
  #modalWrap .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  #modalWrap .sheet-head h3{margin:0; font-size:17px; font-weight:900;}
  #modalWrap .xbtn{width:30px; height:30px; border-radius:50%; background:var(--surface-2); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
  #modalWrap .xbtn svg{width:16px; height:16px;}
  .sheet-foot{display:flex; gap:10px; margin-top:16px;}

  #toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:12.5px; font-weight:700; z-index:200; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; box-shadow:var(--shadow); max-width:88%; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .photow{width:100%; border-radius:10px; margin-top:8px; display:block; border:1px solid var(--border);}
  .barchart{display:flex; align-items:flex-end; gap:8px; height:110px; margin:14px 0 6px;}
  .barchart .bc-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .barchart .bc-bar{width:100%; max-width:26px; border-radius:5px 5px 2px 2px; background:var(--accent); min-height:3px;}
  .barchart .bc-lb{font-size:10px; color:var(--ink-faint);}
  .minibar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .minibar-track{flex:1; height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;}
  .minibar-fill{height:100%; background:var(--accent); border-radius:5px;}

  .center-screen{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;}
  .center-screen svg{width:40px; height:40px; color:var(--ink-faint); margin-bottom:10px;}
  .center-screen h2{margin:0 0 6px; font-size:18px;}
  .center-screen p{color:var(--ink-soft); font-size:13px; max-width:280px; margin:0 0 16px;}

  .id-pick-row{
    display:flex; align-items:center; gap:12px; padding:13px; border-radius:13px;
    background:var(--surface); border:1px solid var(--border); margin-bottom:9px; cursor:pointer;
  }
  .id-pick-row .avatar{width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700;}
  .switch{position:relative; width:38px; height:22px; flex-shrink:0;}
  .switch input{opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer;}
  .switch .track{position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; transition:.15s;}
  .switch .knob{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--ink-faint); transition:.15s;}
  .switch input:checked ~ .track{background:var(--ok-soft); border-color:var(--ok);}
  .switch input:checked ~ .track ~ .knob{transform:translateX(16px); background:var(--ok);}
</style>
</head>
<body>
<div id="shell">
  <div id="topbar">

const LEAVE_STATUS = {pending:{t:'leave_pending', c:'warn'}, approved:{t:'leave_approved', c:'ok'}, rejected:{t:'leave_rejected', c:'critical'}};
const LEAVE_KINDS = ['annual','sick','unpaid','swap'];
function leaveKindLabel(l){ const k=l.kind||(l.type==='swap'?'swap':'leave'); return t('leave_kind_'+k); }
function leaveDays(l){ const s=new Date(l.startDate), e=new Date(l.endDate||l.startDate); return Math.max(1, Math.round((e-s)/86400000)+1); }
function leaveUsed(empId, kind, year){
  return S.leaveRequests.filter(l=>l.employeeId===empId && l.status==='approved' && l.kind===kind && String(l.startDate||'').slice(0,4)===String(year)).reduce((a,l)=>a+leaveDays(l),0);
}
function leaveBalance(emp, kind){
  const allow = kind==='annual' ? emp.annualLeaveDays : emp.sickLeaveDays;
  if(allow==null || allow==='') return null;
  const used=leaveUsed(emp.id, kind, new Date().getFullYear());
  return {allow:Number(allow), used, left:Number(allow)-used};
}
function leaveBalanceSuffix(l){
  const emp=byId(S.employees,l.employeeId); if(!emp || !(l.kind==='annual'||l.kind==='sick')) return '';
  const b=leaveBalance(emp,l.kind); if(!b) return '';
  return ' · '+t('balance_prefix')+b.left+'/'+b.allow+t('leave_this_request_prefix')+leaveDays(l)+t('leave_days_suffix');
}

const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){} },

function $(id){return document.getElementById(id);}
function el(html){const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild;}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uidLocal(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad2(n){return String(n).padStart(2,'0');}
function todayStr(d){d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fmtTime(iso){const d=new Date(iso); return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmtDateTime(iso){const d=new Date(iso); return (d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmtMoney(n){return '¥'+(Number(n)||0).toFixed(2);}
function weekdayCN(d){return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];}
function weekdayLabel(d){
  const en=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const ms=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
  return S.lang==='en' ? en[d.getDay()] : (S.lang==='ms' ? ms[d.getDay()] : weekdayCN(d));
}
function byId(arr,id){return arr.find(x=>x.id===id);}
function empName(id){const e=byId(S.employees,id); return e?e.name:t('deleted_placeholder');}
function devName(id){const d=byId(S.devices,id); return d?d.name:t('deleted_placeholder');}
function deviceZone(d){return (d && (d.zone||d.name)) || t('unzoned');}

function zoneList(){

function groupByZone(devices){
  const map = new Map();
  devices.forEach(d=>{

function kegFreshness(keg, product){
  if(!keg.openedAt) return null;
  const days = (product && product.freshnessDays!=null) ? product.freshnessDays : 30;
  const opened = new Date(keg.openedAt);
  const expiry = new Date(opened.getTime() + days*86400000);
  const hoursLeft = (expiry - new Date())/3600000;
  return {expiry, hoursLeft, expired: hoursLeft<0, soon: hoursLeft>=0 && hoursLeft<=48};
}
function tapCleanInfo(tap){
  const interval = tap.cleaningIntervalDays!=null ? tap.cleaningIntervalDays : 14;
  if(!tap.lastCleanedAt) return {overdue:true, daysSince:null};
  const daysSince = (new Date()-new Date(tap.lastCleanedAt))/86400000;
  return {overdue: daysSince>=interval, daysSince: Math.floor(daysSince)};
}
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),2200);
}
/* Simple salted SHA-256 PIN check — a deterrent against casual co-worker
   impersonation (e.g. clocking in for someone else), NOT real security:
   anyone with API access to the database can read the hash+salt directly,
   bypassing the app entirely. Good enough for its actual job here. */
async function hashPin(pin, salt){
  if(!self.crypto || !crypto.subtle){ throw {code:'unavailable', message:'crypto.subtle unavailable (requires a secure https context)'}; }
  const enc = new TextEncoder().encode(salt+':'+pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  return (self.crypto&&crypto.randomUUID) ? crypto.randomUUID() : uidLocal();
}

}

}

/* ============================ SUPABASE-BACKED DB ADAPTER ============================
   Mimics the doc/collection/onSnapshot interface the rest of this app is written
   against, backed by one generic Postgres table: store(collection, id, data jsonb).
   Ordering/limiting is done client-side after fetch (collections here are small),
   which sidesteps any uncertainty around ordering by jsonb fields server-side. */
function makeSupabaseDb(sb){
  const collListeners = new Map(); // collection -> Set of {order,dir,limit,next,err}
  const docListeners = new Map();  // path -> Set of {next,err}
  let channel = null;

  function parsePath(path){
    const parts = String(path).split('/');
    const id = parts[parts.length-1];
    const collection = parts.slice(0,-1).join('/');
    return {collection, id};
  }
  function toDocSnap(row){
    return { id: row.id, exists:true, data: ()=>row.data };
  }
  function sortRows(rows, order, dir){
    if(!order) return rows;
    const list = rows.slice();
    list.sort((a,b)=>{
      const av=a.data[order], bv=b.data[order];
      if(av==null && bv==null) return 0;
      if(av==null) return 1;
      if(bv==null) return -1;
      const cmp = av<bv?-1:(av>bv?1:0);
      return dir==='desc' ? -cmp : cmp;
    });
    return list;
  }
  function buildQuery(collection, opts){
    opts=opts||{};
    let q = sb.from('store').select('id,data').eq('collection', collection);
    (opts.filters||[]).forEach(f=>{
      const col='data->>'+f.field;
      if(f.op==='>=') q=q.gte(col,f.value); else if(f.op==='<=') q=q.lte(col,f.value);
      else if(f.op==='>') q=q.gt(col,f.value); else if(f.op==='<') q=q.lt(col,f.value);
      else if(f.op==='==') q=q.eq(col,f.value);
    });
    if(opts.order) q=q.order('data->>'+opts.order, {ascending: opts.dir!=='desc'});
    return q;
  }
  async function fetchRows(collection, opts){
    opts=opts||{};
    let q=buildQuery(collection, opts);
    if(opts.limit) q=q.limit(opts.limit);
    const {data, error} = await q;
    if(error) throw error;
    return data||[];
  }
  // Page through every matching row (PostgREST caps a single response at 1000).
  async function fetchAll(collection, opts){
    const out=[]; let from=0; const page=1000;
    while(true){
      const {data, error} = await buildQuery(collection, opts).range(from, from+page-1);
      if(error) throw error;
      out.push(...(data||[]));
      if(!data || data.length<page) break;
      from+=page;
    }
    return out;
  }
  function matchFilters(row, filters){
    return (filters||[]).every(f=>{
      const v=row.data[f.field]; if(v==null) return false;
      switch(f.op){ case '>=': return v>=f.value; case '<=': return v<=f.value; case '>': return v>f.value; case '<': return v<f.value; case '==': return v==f.value; default: return true; }
    });
  }
  function ensureChannel(){
    if(channel) return;
    channel = sb.channel('store-changes')
      .on('postgres_changes', {event:'*', schema:'public', table:'store'}, payload=>{
        const row = payload.new || payload.old;
        if(row && row.collection) refreshCollection(row.collection);
      })
      .subscribe(status=>{ S.realtimeOk = (status==="SUBSCRIBED"); });
    // Fallback: if realtime is not connected (blocked WebSockets), poll every 25s.
    setInterval(()=>{ if(!S.realtimeOk){ [...collListeners.keys()].forEach(c=>refreshCollection(c)); } }, 25000);
  }
  async function refreshCollection(collection){
    const subs=[...(collListeners.get(collection)||[])];
    const lead=subs[0]||{};
    let rows;
    try{ rows = await fetchRows(collection, {filters:lead.filters, order:lead.order, dir:lead.dir, limit:(subs.length===1?lead.limit:null)}); }
    catch(e){
      const err = {code:'unavailable', message:String((e&&e.message)||e)};
      (collListeners.get(collection)||[]).forEach(s=>s.err && s.err(err));
      return;
    }
    (collListeners.get(collection)||new Set()).forEach(s=>{
      let list = sortRows(rows.filter(r=>matchFilters(r, s.filters)), s.order, s.dir);
      if(s.limit) list = list.slice(0, s.limit);
      const docs = list.map(toDocSnap);
      s.next({docs, size:docs.length, empty:docs.length===0, docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}});
    });
    docListeners.forEach((subs, path)=>{
      const {collection:c, id} = parsePath(path);
      if(c!==collection) return;
      const row = rows.find(r=>r.id===id);
      const snap = row ? toDocSnap(row) : {id, exists:false, data:()=>undefined};
      subs.forEach(s=>s.next(snap));
    });
  }

  function docRef(path){
    const {collection, id} = parsePath(path);
    return {
      id, path,
      async get(){
        const {data, error} = await sb.from('store').select('id,data').eq('collection',collection).eq('id',id).maybeSingle();
        if(error) throw error;
        return data ? toDocSnap(data) : {id, exists:false, data:()=>undefined};
      },
      async set(data){
        const {error} = await sb.from('store').upsert({collection, id, data, updated_at:new Date().toISOString()}, {onConflict:'collection,id'});
        if(error) throw Object.assign(error, {code:'unavailable'});
        refreshCollection(collection);
      },
      async update(data){
        const {data:cur, error:e1} = await sb.from('store').select('data').eq('collection',collection).eq('id',id).maybeSingle();
        if(e1) throw Object.assign(e1, {code:'unavailable'});
        if(!cur) throw {code:'invalid_argument', message:'document does not exist'};
        const merged = Object.assign({}, cur.data, data);
        const {error} = await sb.from('store').update({data:merged, updated_at:new Date().toISOString()}).eq('collection',collection).eq('id',id);
        if(error) throw Object.assign(error, {code:'unavailable'});
        refreshCollection(collection);
      },
      async delete(){
        const {error} = await sb.from('store').delete().eq('collection',collection).eq('id',id);
        if(error) throw Object.assign(error, {code:'unavailable'});
        refreshCollection(collection);
      },
      onSnapshot(next, err){
        ensureChannel();
        if(!docListeners.has(path)) docListeners.set(path, new Set());
        const sub = {next, err};
        docListeners.get(path).add(sub);
        (async ()=>{
          try{ const ref=docRef(path); next(await ref.get()); }
          catch(e){ err && err({code:'unavailable', message:String((e&&e.message)||e)}); }
        })();
        return ()=>{ docListeners.get(path).delete(sub); };
      },
      collection(sub){ return collectionRef(path+'/'+sub); },
    };
  }
  function collectionRef(collection){
    let orderField=null, orderDir='asc', limitN=null; const filters=[];
    const api = {
      where(field,op,value){ filters.push({field,op,value}); return api; },
      orderBy(field,dir){ orderField=field; orderDir=dir||'asc'; return api; },
      limit(n){ limitN=n; return api; },
      async get(){
        const rows = sortRows(await fetchRows(collection, {filters, order:orderField, dir:orderDir, limit:limitN}), orderField, orderDir);
        const docs = (limitN?rows.slice(0,limitN):rows).map(toDocSnap);
        return {docs, size:docs.length, empty:docs.length===0};
      },
      onSnapshot(next, err){
        ensureChannel();
        const sub = {order:orderField, dir:orderDir, limit:limitN, filters, next, err};
        if(!collListeners.has(collection)) collListeners.set(collection, new Set());
        collListeners.get(collection).add(sub);
        refreshCollection(collection);
        return ()=>{ collListeners.get(collection).delete(sub); };
      },
      doc(docId){ return docRef(collection+'/'+(docId || (self.crypto&&crypto.randomUUID ? crypto.randomUUID() : uidLocal()))); },
      async add(data){
        const ref = api.doc();
        await ref.set(data);
        return ref;
      },
    };
    return api;
  }
  return { collection: collectionRef, doc: docRef,
    rawFetch: (collection, filters, order, dir)=>fetchAll(collection, {filters, order, dir}) };
}
function makeBrowserDownloads(){
  return {
    async save({filename, data}){
      const blob = (data instanceof Blob) ? data : new Blob([data], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      return {status:'saved'};
    }
  };
}

/* ============================ BOOTSTRAP ============================ */
async function boot(){
  tickClock();
  setInterval(tickClock, 30000);
  renderApp();
  if(!window.supabase || !window.supabase.createClient){ S.dbState='unavailable'; renderApp(); return; }
  const tok=LS.get('bgc_token');
  if(tok && tokenValid(tok)){ S.token=tok; } else { LS.remove('bgc_token'); S.token=null; }
  S.sb = makeClient(S.token);
  S.db = makeSupabaseDb(S.sb);
  S.downloads = makeBrowserDownloads();
  if(S.token){
    S.dbState='ready';
    subscribeAll();
  } else {
    try{ await loadLoginList(); S.dbState='ready'; }
    catch(e){ S.dbState='unavailable'; S.dbErrorDetail=String((e&&e.message)||e); }
  }
  renderApp();
}
function tickClock(){
  const d=new Date();
  $('topDate').textContent = todayStr(d)+' '+weekdayLabel(d)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}

function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function sub(colPath, key, opts){
  opts = opts||{};
  let q = S.db.collection(colPath);
  if(opts.sinceDays){ const v=isoDaysAgo(opts.sinceDays); q = q.where(opts.sinceField||'createdAt','>=', opts.sinceDate?v.slice(0,10):v); }
  if(opts.order) q = q.orderBy(opts.order, opts.dir||'desc');
  if(opts.limit) q = q.limit(opts.limit);
  q.onSnapshot(snap=>{
    S[key] = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    if(key==='employees') S.employeesLoaded=true;
    renderApp();
  }, err=>{ console.warn(colPath, err); });
}

  sub('sites','sites',{limit:200});
  sub('products','products',{limit:500});

  // Live views keep a rolling window (about 3 months); older history stays in the
  // database and is reachable through the month export / monthly report.

  sub('attendance','attendance',{order:'createdAt',limit:1000,sinceDays:92});
  sub('inspections','inspections',{order:'createdAt',limit:300,sinceDays:92});
  sub('faults','faults',{order:'createdAt',limit:300});
  sub('schedules','schedules',{order:'date',dir:'asc',limit:600,sinceDays:30,sinceField:'date',sinceDate:true});
  sub('leaveRequests','leaveRequests',{order:'createdAt',limit:400,sinceDays:400});
  sub('memos','memos',{order:'createdAt',limit:200});
  sub('memoReads','memoReads',{limit:500}); // one doc per employee: {readIds:{memoId:readAt}}
  sub('punchRequests','punchRequests',{order:'createdAt',limit:300,sinceDays:120});
  sub('swapRequests','swapRequests',{order:'createdAt',limit:300,sinceDays:120});
  sub('taskTemplates','taskTemplates',{limit:200});
  sub('taskRuns','taskRuns',{order:'date',limit:800,sinceDays:30,sinceField:'date',sinceDate:true});
  sub('handovers','handovers',{order:'createdAt',limit:200,sinceDays:14});
  sub('equipment','equipment',{limit:300});
  sub('tempLogs','tempLogs',{order:'createdAt',limit:800,sinceDays:14});
  sub('safetyChecks','safetyChecks',{order:'createdAt',limit:400,sinceDays:7});
  sub('incidents','incidents',{order:'createdAt',limit:300,sinceDays:120});
  sub('notifSeen','notifSeen',{limit:500});
  sub('beerProducts','beerProducts',{limit:200});
  sub('taps','taps',{limit:100});
  sub('kegs','kegs',{order:'createdAt',dir:'desc',limit:500});
  sub('kegLogs','kegLogs',{order:'createdAt',limit:400,sinceDays:92});
  S.db.doc('meta/settings').onSnapshot(snap=>{
    if(snap.exists){ S.settings = Object.assign({}, S.settings, snap.data()); }
    renderApp();
  }, ()=>{});
}

/* ============================ PHOTO HELPER ============================ */
function photoPicker(onReady, cameraOnly, existingUrl){
  const pickLabel = cameraOnly ? t('photo_take') : t('photo_pick');
  const retakeLabel = cameraOnly ? t('photo_retake_cam') : t('photo_retake');
  const wrap=el('<div></div>');
  const input=el(`<input type="file" accept="image/*" ${cameraOnly?'capture="environment"':''} style="display:none">`);
  const btnRow=el('<div class="row"></div>');
  const btn=el(`<button type="button" class="btn" style="flex:1;">${ICONS.camera}<span>${esc(existingUrl?retakeLabel:pickLabel)}</span></button>`);
  const removeBtn=el(`<button type="button" class="btn danger sm" style="display:${existingUrl?'inline-flex':'none'};">${esc(t('btn_remove_photo'))}</button>`);
  const preview=el(`<img class="photow" style="display:${existingUrl?'block':'none'};" ${existingUrl?`src="${existingUrl}"`:''}>`);
  let dataUrl=existingUrl||null;
  btn.onclick=()=>input.click();
  removeBtn.onclick=()=>{
    dataUrl=null; preview.style.display='none'; preview.removeAttribute('src');
    removeBtn.style.display='none'; btn.querySelector('span').textContent=pickLabel;
    onReady && onReady(null);
  };
  input.onchange=async ()=>{
    const f=input.files[0]; if(!f) return;
    btn.querySelector('span').textContent=t('photo_compressing');
    try{
      dataUrl = await compressImage(f);
      if(dataUrl){
        preview.src=dataUrl; preview.style.display='block';
        btn.querySelector('span').textContent=retakeLabel;
        removeBtn.style.display='inline-flex';
        onReady && onReady(dataUrl);
      } else {
        preview.style.display='none';
        btn.querySelector('span').textContent=pickLabel;
        toast(t('toast_photo_too_large'));
      }
    }catch(e){ toast(t('toast_photo_failed')); btn.querySelector('span').textContent=pickLabel; }
  };
  btnRow.appendChild(btn); btnRow.appendChild(removeBtn);
  wrap.appendChild(btnRow); wrap.appendChild(input); wrap.appendChild(preview);
  wrap.getPhoto=()=>dataUrl;
  return wrap;
}
function compressImage(file, maxW, quality){
  maxW=maxW||480; quality=quality||0.55;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1, maxW/img.width);
        const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        let q=quality, out=canvas.toDataURL('image/jpeg',q);
        while(out.length>170000 && q>0.25){ q-=0.1; out=canvas.toDataURL('image/jpeg',q); }
        if(out.length>170000){ resolve(null); } else resolve(out);
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

function geoErrorMessage(reason){
  const m={denied:t('geo_err_denied'), unavailable:t('geo_err_unavailable'), timeout:t('geo_err_timeout'),
    unsupported:t('geo_err_unsupported'), insecure:t('geo_err_insecure')};
  return (reason && m[reason]) || t('geo_none');
}
function getGeo(){
  return new Promise(resolve=>{
    if(!self.isSecureContext){ resolve({error:'insecure'}); return; }
    if(!navigator.geolocation){ resolve({error:'unsupported'}); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:Math.round(pos.coords.accuracy)}),
      err=>{
        const reason = err.code===1 ? 'denied' : err.code===2 ? 'unavailable' : err.code===3 ? 'timeout' : 'unknown';
        resolve({error:reason});
      },
      {enableHighAccuracy:true, timeout:8000, maximumAge:20000}
    );
  });
}
function deviceCoords(d){
  if(d.lat!=null && d.lng!=null) return {lat:d.lat, lng:d.lng};
  const site = siteFor(deviceZone(d));
  return (site && site.lat!=null && site.lng!=null) ? {lat:site.lat, lng:site.lng} : null;
}
function nearestDeviceInfo(geo){
  if(!geo || geo.error) return null;
  const withCoords = S.devices.map(d=>({d, c:deviceCoords(d)})).filter(x=>x.c);
  if(withCoords.length===0) return {configured:false};
  let best=null, bestD=Infinity;
  withCoords.forEach(({d,c})=>{
    const dist=haversine(geo.lat,geo.lng,c.lat,c.lng);
    if(dist<bestD){ bestD=dist; best=d; }
  });
  return {configured:true, device:best, distance:Math.round(bestD), inRange: bestD<=(S.settings.geofenceRadius||300)};
}

/* ============================ FIELD FORM HELPER ============================ */
function fieldsHTML(fields, values){
  values=values||{};
  return fields.map(f=>{
    const v = values[f.key]!=null ? values[f.key] : (f.default!=null?f.default:'');
    if(f.type==='select'){
      const opts=f.options.map(o=>`<option value="${esc(o.v)}" ${String(v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('');
      return `<label class="field"><span class="fl">${esc(f.label)}</span><select data-k="${f.key}">${opts}</select></label>`;
    }
    if(f.type==='textarea'){
      return `<label class="field"><span class="fl">${esc(f.label)}</span><textarea data-k="${f.key}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea></label>`;
    }
    return `<label class="field"><span class="fl">${esc(f.label)}</span><input type="${f.type||'text'}" data-k="${f.key}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.step?`step="${f.step}"`:''}></label>`;
  }).join('');
}
function readFields(container, fields){
  const out={};
  fields.forEach(f=>{
    const node = container.querySelector(`[data-k="${f.key}"]`);
    let v = node ? node.value : '';
    if(f.type==='number'){ v = v===''?null:Number(v); }
    out[f.key]=v;
  });
  return out;
}

/* ============================ LOGIN / TOKEN ============================ */
function makeClient(token){
  const opts={ realtime:{params:{eventsPerSecond:10}},
    global:{ fetch:(url,o)=>fetch(url, Object.assign({}, o, {cache:'no-store'})).then(r=>{ if(r.status===401 && S.token){ toast(t('session_expired')); logout(); } return r; }) } };
  if(token) opts.global.headers={Authorization:'Bearer '+token};
  const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, opts);
  if(token && sb.realtime && sb.realtime.setAuth){ try{ sb.realtime.setAuth(token); }catch(e){} }
  return sb;
}
async function rpc(name, args){
  const {data,error}=await S.sb.rpc(name, args||{});
  if(error) throw {code:error.code||'rpc', message:error.message||String(error)};
  return data;
}
function tokenPayload(tok){ try{ return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }catch(e){ return null; } }
function tokenValid(tok){ const p=tokenPayload(tok); return !!(p && p.exp && p.exp*1000 > Date.now()+60000 && p.employee_id); }
async function loadLoginList(){
  const rows=await rpc('login_list');
  S.loginList=rows||[];
  S.employees=S.loginList.map(r=>({id:r.id, name:r.name, role:r.role, homeBranch:r.home_branch||'', jobTitle:r.job_title||'', hasPin:!!r.has_pin, active:r.active!==false}));
}
function finishLogin(token, e){
  S.token=token; LS.set('bgc_token', token); LS.set('bgc_employee_id', e.id); S.employeeId=e.id; S.employeesLoaded=false;
  S.sb=makeClient(token); S.db=makeSupabaseDb(S.sb); S.dbState='ready'; closeSheet();
  subscribeAll(); renderApp();
}
function logout(){
  S.token=null; S.employeeId=null; S.pickerBranch=null;
  LS.remove('bgc_token'); LS.remove('bgc_employee_id');
  location.reload();
}
function pinErrMsg(err){
  const m=String((err&&err.message)||'');
  if(/wrong_pin/.test(m)) return t('err_pin_wrong');
  if(/locked/.test(m)) return t('err_pin_locked');
  if(/pin_exists/.test(m)) return t('err_pin_exists');
  if(/inactive/.test(m)) return t('err_pin_inactive');
  if(/jwt_secret_not_configured/.test(m)) return 'Server login key not configured (see auth.sql notes)';
  return dbErrMsg(err);
}

function openVerifyPinForm(e){
  const body=el('<div></div>');
  const f=[{key:'pin', label:t('field_pin'), type:'password'}];
  const formEl=el('<div>'+fieldsHTML(f)+'</div>'); body.appendChild(formEl);
  const errMsg=el('<div class="hint" style="color:var(--critical);"></div>'); body.appendChild(errMsg);
  const foot=el('<div class="sheet-foot"></div>');
  const btn=el(`<button class="btn primary block">${esc(t('btn_login'))}</button>`);
  const attempt=async ()=>{
    const v=readFields(formEl,f);
    if(!v.pin){ return; }
    btn.disabled=true; errMsg.textContent='';
    try{
      const salt=await rpc('pin_salt', {emp_id:e.id});
      if(!salt){ closeSheet(); openSetPinForm(e); return; }
      const hash=await hashPin(v.pin, salt);
      const token=await rpc('login', {emp_id:e.id, pin_hash:hash});
      if(!token) throw {code:'wrong_pin', message:'wrong_pin'};
      finishLogin(token, e);
    }catch(err){ errMsg.textContent=pinErrMsg(err); btn.disabled=false; }
  };
  btn.onclick=attempt;
  formEl.querySelector('input').addEventListener('keydown', ev=>{ if(ev.key==='Enter') attempt(); });
  foot.appendChild(btn); body.appendChild(foot);
  openSheet(e.name, body);
  setTimeout(()=>{ const inp=formEl.querySelector('input'); if(inp) inp.focus(); }, 50);
}

/* ============================ CLOCK ============================ */
function clockView(){
  const e=currentEmployee();
  const c=el('<div></div>');
  const todayAtt = S.attendance.filter(a=>a.employeeId===e.id && a.createdAt.slice(0,10)===todayStr());
  const last = todayAtt[0];
  const nextType = (!last || last.type==='out') ? 'in' : 'out';

  const card=el('<div class="card" style="text-align:center;"></div>');
  const now=new Date();
  card.innerHTML = `<div style="font-size:13px; color:var(--ink-soft); font-weight:700;">${weekdayLabel(now)} · ${todayStr(now)}</div>`;
  let clockSel=null;
  { const branches=allBranchIds();
    if(branches.length>0){
      clockSel=el('<select style="margin:8px auto 2px; display:block; max-width:240px;"></select>');
      [{v:'',l:t('clock_branch_none')}].concat(branches.map(b=>({v:b, l:b+(b===myBranch()?' · '+t('clock_branch_home'):'')}))).forEach(o=>{ const op=document.createElement('option'); op.value=o.v; op.textContent=o.l; clockSel.appendChild(op); });
      clockSel.value=defaultClockBranch(); if(clockSel.value!==defaultClockBranch()) clockSel.value='';
      clockSel.onchange=()=>{ S.clockBranch=clockSel.value; };
      card.appendChild(el(`<div class="hint" style="margin:6px 0 0;">${esc(t('clock_branch_label'))}</div>`));
      card.appendChild(clockSel);
    } }
  const bigBtn=el(`<button class="clockbtn ${nextType==='out'?'out':''}"><span class="t">${nextType==='in'?esc(t('btn_clock_in')):esc(t('btn_clock_out'))}</span><span class="s" id="clockNow">${pad2(now.getHours())}:${pad2(now.getMinutes())}</span></button>`);
  card.appendChild(bigBtn);
  const photoWrap = photoPicker(null, true);
  photoWrap.style.margin='12px auto 0'; photoWrap.style.maxWidth='260px';
  card.appendChild(photoWrap);
  const geoStatus=el(`<div class="hint" id="geoStatus">${esc(S.lastGeoMsg||t('clock_geo_hint'))}</div>`);
  card.appendChild(geoStatus);
  c.appendChild(card);

  bigBtn.onclick=async ()=>{
    if(!S.db){ toast(t('err_db_disconnected')); return; }
    bigBtn.disabled=true;
    geoStatus.textContent=t('clock_geo_getting');
    const geo = await getGeo();
    const geoOk = geo && !geo.error;
    const branch = clockSel ? clockSel.value : defaultClockBranch();
    const bInfo = branchGeoInfo(geo, branch);
    const near = bInfo ? null : nearestDeviceInfo(geo);
    const photo = photoWrap.getPhoto();
    const rec = {employeeId:e.id, employeeName:e.name, type:nextType, createdAt:new Date().toISOString(), note:''};
    if(geoOk) rec.geo=geo;
    if(branch){ rec.branch=branch; if(myBranch() && branch!==myBranch()) rec.cover=true; }
    if(bInfo){ rec.distanceM=bInfo.distance; rec.geoFlag=bInfo.inRange?'in_range':'out_of_range'; }
    else if(near && near.configured){ rec.nearestDeviceId=near.device.id; rec.distanceM=near.distance; rec.geoFlag = near.inRange?'in_range':'out_of_range'; }
    else if(geoOk) rec.geoFlag='not_configured';
    else { rec.geoFlag='no_location'; if(geo && geo.error) rec.geoErrorReason=geo.error; }
    if(photo) rec.photo=photo;
    try{
      await S.db.collection('attendance').add(rec);
      toast(nextType==='in'?t('toast_clock_in_ok'):t('toast_clock_out_ok'));
      photoWrap.remove();
    }catch(err){ toast(dbErrMsg(err)); }
    bigBtn.disabled=false;
    const gi = bInfo || (near&&near.configured ? near : null);
    S.lastGeoMsg = geoStatus.textContent = geoOk ? (gi ? (gi.inRange?t('geo_in_range'):t('geo_out_of_range')+gi.distance+t('geo_out_of_range_suffix')) : (branch ? t('geo_branch_no_coords') : t('geo_no_coords'))) : geoErrorMessage(geo&&geo.error);
  };

  // history / monthly report
  if(canManageStaff()){
    const seg=el(`<div class="seg" style="margin:18px 0 10px;"><button data-v="records" class="${S.clockSub!=='report'?'on':''}">${esc(t('clock_tab_records'))}</button><button data-v="report" class="${S.clockSub==='report'?'on':''}">${esc(t('clock_tab_report'))}</button></div>`);

function monthFilters(ym, field){
  const [y,m]=ym.split('-').map(Number);
  const start=new Date(y,m-1,1), end=new Date(y,m,1);
  field=field||'createdAt';
  const fmt = field==='date' ? d=>todayStr(d) : d=>d.toISOString();
  return [{field, op:'>=', value:fmt(start)},{field, op:'<', value:fmt(end)}];
}
async function loadReport(){
  if(S.reportLoading) return;
  S.reportLoading=true; renderApp();
  try{
    const [att, sched] = await Promise.all([
      S.db.rawFetch('attendance', monthFilters(S.reportMonth), 'createdAt', 'asc'),
      S.db.rawFetch('schedules', monthFilters(S.reportMonth,'date'), 'date', 'asc'),
    ]);
    S.reportData={month:S.reportMonth, att:att.map(r=>Object.assign({id:r.id}, r.data)), sched:sched.map(r=>Object.assign({id:r.id}, r.data))};
  }catch(e){ toast(dbErrMsg(e)); S.reportData={month:S.reportMonth, att:[], sched:[]}; }
  S.reportLoading=false; renderApp();
}
function reportScopeEmployees(){
  let emps = S.employees;
  if(isManager()) emps = emps.filter(x=>x.homeBranch===myBranch());
  else if(S.reportBranch!=='all') emps = emps.filter(x=>x.homeBranch===S.reportBranch);
  return emps;
}
function computeReport(){
  const d=S.reportData; if(!d) return [];
  const grace = S.settings.lateGraceMin!=null ? S.settings.lateGraceMin : 10;
  const toMin = t=>{ const [h,m]=String(t||'').split(':').map(Number); return isNaN(h)?null:h*60+(m||0); };
  const schedMap={}; d.sched.forEach(s=>{ schedMap[s.employeeId+'|'+s.date]=s; });
  const byEmpDay={};
  d.att.forEach(a=>{ const day=todayStr(new Date(a.createdAt)); const k=a.employeeId+'|'+day; (byEmpDay[k]=byEmpDay[k]||[]).push(a); });
  const stats={};
  Object.keys(byEmpDay).forEach(k=>{
    const [empId, day]=k.split('|');
    const recs=byEmpDay[k].sort((a,b)=>a.createdAt<b.createdAt?-1:1);
    const st = stats[empId] = stats[empId] || {days:0, minutes:0, late:0, early:0, missing:0, cover:0};
    let hadIn=false, openIn=null, firstIn=null, lastOut=null;
    recs.forEach(r=>{
      const tm=new Date(r.createdAt);
      if(r.type==='in'){ if(openIn){ st.missing++; } openIn=tm; hadIn=true; if(!firstIn) firstIn=tm; }
      else { if(openIn){ st.minutes += (tm-openIn)/60000; openIn=null; } lastOut=tm; }
    });
    if(openIn) st.missing++;
    if(hadIn) st.days++;
    if(recs.some(r=>r.cover)) st.cover++;
    const sc=schedMap[empId+'|'+day];
    if(sc){
      const ss=toMin(sc.shiftStart), se=toMin(sc.shiftEnd);
      if(ss!=null && firstIn && (firstIn.getHours()*60+firstIn.getMinutes()) > ss+grace) st.late++;
      if(se!=null && lastOut && (lastOut.getHours()*60+lastOut.getMinutes()) < se-grace) st.early++;
    }
  });
  return reportScopeEmployees().map(e=>Object.assign({emp:e}, stats[e.id]||{days:0,minutes:0,late:0,early:0,missing:0,cover:0}))
    .filter(r=>r.days>0 || r.emp.active!==false)
    .sort((a,b)=>b.days-a.days || a.emp.name.localeCompare(b.emp.name,'zh'));
}

function openRestockForm(device, product, qty){
  const body=el('<div></div>');
  body.innerHTML=`<div class="row" style="margin-bottom:14px;"><span class="pill accent">${esc(device.name)}</span><span class="pill n">${esc(t('stock_current'))}${qty}${esc(product.unit||'')}</span></div>`;
  const seg=el(`<div class="seg" style="margin-bottom:14px;">
    <button data-v="restock" class="on">${esc(t('seg_restock'))}</button>
    <button data-v="out">${esc(t('seg_out'))}</button>
    <button data-v="adjust">${esc(t('seg_adjust'))}</button></div>`);
  let mode='restock';
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ mode=b.dataset.v; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); qtyInput.placeholder = mode==='adjust'?t('ph_adjust_qty'):t('field_qty'); });
  body.appendChild(seg);
  const qtyWrap=el(`<label class="field"><span class="fl">${esc(t('field_qty'))}</span></label>`);
  const qtyInput=el(`<input type="number" min="0" placeholder="${esc(t('field_qty'))}">`);
  qtyWrap.appendChild(qtyInput);
  body.appendChild(qtyWrap);
  const noteWrap=el(`<label class="field"><span class="fl">${esc(t('field_note_opt'))}</span></label>`);
  const noteInput=el(`<textarea placeholder="${esc(t('ph_restock_note'))}"></textarea>`);
  noteWrap.appendChild(noteInput);
  body.appendChild(noteWrap);

  const foot=el('<div class="sheet-foot"></div>');
  const submitBtn=el(`<button class="btn primary block">${esc(t('btn_submit'))}</button>`);
  submitBtn.onclick=async ()=>{
    const n=Number(qtyInput.value);
    if(qtyInput.value==='' || isNaN(n) || n<0){ toast(t('err_valid_qty')); return; }
    let delta, newQty;
    if(mode==='restock'){ delta=n; newQty=qty+n; }
    else if(mode==='out'){ delta=-n; newQty=Math.max(0,qty-n); }
    else { delta=n-qty; newQty=n; }
    submitBtn.disabled=true; submitBtn.textContent=t('toast_submitting');
    const e=currentEmployee();
    try{
      await S.db.collection('restockLogs').add({deviceId:device.id, productId:product.id, type:mode, deltaQty:delta, qtyAfter:newQty, employeeId:e.id, employeeName:e.name, note:noteInput.value||'', createdAt:new Date().toISOString()});
      await S.db.doc('inventory/'+device.id+'__'+product.id).set({deviceId:device.id, productId:product.id, qty:newQty, updatedAt:new Date().toISOString(), updatedBy:e.name});
      toast(t('toast_stock_updated'));
      closeSheet();
    }catch(err){ toast(dbErrMsg(err)); submitBtn.disabled=false; submitBtn.textContent=t('btn_submit'); }
  };
  foot.appendChild(submitBtn);
  body.appendChild(foot);
  openSheet(product.name+t('sheet_stock_adjust'), body);
}
function stockReport(){
  const c=el('<div></div>');
  const days=[]; const now=new Date();
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); days.push(d); }
  const inSum={}, outSum={};
  days.forEach(d=>{ const k=todayStr(d); inSum[k]=0; outSum[k]=0; });
  S.restockLogs.forEach(l=>{
    const k=(l.createdAt||'').slice(0,10);
    if(!(k in inSum)) return;
    if(l.deltaQty>0) inSum[k]+=l.deltaQty; else outSum[k]+=Math.abs(l.deltaQty);
  });
  const maxV = Math.max(1, ...days.map(d=>Math.max(inSum[todayStr(d)],outSum[todayStr(d)])));

  const card=el('<div class="card"></div>');
  card.innerHTML=`<div style="font-weight:800; font-size:13px; color:var(--ink-soft);">${esc(t('report_7day_restock'))}</div>`;
  const chart=el('<div class="barchart"></div>');
  days.forEach(d=>{
    const k=todayStr(d), v=inSum[k];
    const h=Math.max(3, Math.round((v/maxV)*90));
    chart.appendChild(el(`<div class="bc-col"><div class="num" style="font-size:10px; color:var(--ink-soft);">${v||''}</div><div class="bc-bar" style="height:${h}px;"></div><div class="bc-lb">${weekdayLabel(d)}</div></div>`));
  });
  card.appendChild(chart);
  c.appendChild(card);

  // top consumed products (by out qty across all logs loaded)
  const consume={};
  S.restockLogs.forEach(l=>{ if(l.deltaQty<0){ consume[l.productId]=(consume[l.productId]||0)+Math.abs(l.deltaQty); } });
  const ranked = Object.entries(consume).sort((a,b)=>b[1]-a[1]).slice(0,6);
  c.appendChild(el(`<h2 class="sec">${esc(t('report_consume_rank'))}</h2>`));
  const card2=el('<div class="card"></div>');
  if(ranked.length===0){ card2.innerHTML=`<div class="hint">${esc(t('report_no_out'))}</div>`; }
  else{
    const maxC = ranked[0][1];
    ranked.forEach(([pid,v])=>{
      const p=byId(S.products,pid);
      card2.appendChild(el(`<div class="minibar-row"><div style="width:76px; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(p?p.name:'—')}</div><div class="minibar-track"><div class="minibar-fill" style="width:${Math.round(v/maxC*100)}%;"></div></div><div class="num" style="width:40px; text-align:right; font-size:12.5px;">${v}</div></div>`));
    });
  }
  c.appendChild(card2);

  c.appendChild(el(`<h2 class="sec">${esc(t('report_recent'))}</h2>`));
  const list=el('<div class="list"></div>');
  S.restockLogs.slice(0,20).forEach(l=>{
    const tName = l.type==='restock'?t('log_restock'):l.type==='out'?t('log_out'):t('log_adjust');
    list.appendChild(el(`<div class="list-row" style="cursor:default;"><div class="lr-main"><div class="lr-title">${esc(devName(l.deviceId))} · ${esc(prodName(l.productId))}</div><div class="lr-sub">${esc(tName)} · ${esc(l.employeeName)} · ${fmtDateTime(l.createdAt)}</div></div><div class="num" style="font-weight:800; color:${l.deltaQty>=0?'var(--ok)':'var(--critical)'}">${l.deltaQty>0?'+':''}${l.deltaQty}</div></div>`));
  });
  if(S.restockLogs.length===0) list.appendChild(el(`<div class="empty">${ICONS.inbox}<div>${esc(t('empty_no_records'))}</div></div>`));
  c.appendChild(list);
  return c;
}

  const tapInBranch=(tapId)=>{ if(S.beerZoneFilter==='all') return true; const tp=byId(S.taps,tapId); return tp && tp.zone===S.beerZoneFilter; };

  const tappedKegs = S.kegs.filter(k=>k.status==='tapped' && tapInBranch(k.tapId));
  c.appendChild(el(`<h2 class="sec">${esc(t('beer_on_tap'))}</h2>`));
  const tapList=el('<div class="list"></div>');
  if(tappedKegs.length===0) tapList.appendChild(el(`<div class="hint">${esc(t('beer_no_kegs_on_tap'))}</div>`));
  tappedKegs.forEach(k=>{
    const p=byId(S.beerProducts,k.productId);
    const fresh=kegFreshness(k,p);
    const pct = k.sizeLiters ? Math.max(0,Math.min(100, Math.round((k.remainingLiters/k.sizeLiters)*100))) : null;
    let freshPill='';
    if(fresh){
      freshPill = fresh.expired ? `<span class="pill critical">${esc(t('beer_expired'))}</span>`
        : fresh.soon ? `<span class="pill warn">${esc(t('beer_expiring_soon'))}</span>`
        : `<span class="pill ok">${esc(t('beer_fresh'))}</span>`;
    }
    const row=el(`<div class="list-row">${p&&p.image?`<img class="lr-thumb" src="${p.image}">`:''}<div class="lr-main"><div class="lr-title">${esc(p?p.name:t('deleted_placeholder'))} · ${esc(tapName(k.tapId))}</div><div class="lr-sub">${pct!=null?pct+'% '+esc(t('beer_remaining')):''}</div></div>${freshPill}</div>`);
    row.onclick=()=>openKegDetail(k);
    tapList.appendChild(row);
  });
  c.appendChild(tapList);

  c.appendChild(el(`<h2 class="sec">${esc(t('beer_in_stock'))}</h2>`));
  const stockList=el('<div class="list"></div>');
  const grouped={};
  S.kegs.filter(k=>k.status==='in_stock').forEach(k=>{ grouped[k.productId]=(grouped[k.productId]||0)+1; });
  S.beerProducts.forEach(p=>{
    const count = grouped[p.id]||0;
    const low = count <= (p.lowStockKegs!=null?p.lowStockKegs:1);
    const row=el(`<div class="list-row" style="cursor:default;">${p.image?`<img class="lr-thumb" src="${p.image}">`:''}<div class="lr-main"><div class="lr-title">${esc(p.name)}</div><div class="lr-sub">${esc(p.brand||'')}</div></div><span class="pill ${count===0?'critical':(low?'warn':'ok')}">${count} ${esc(t('beer_kegs_unit'))}</span></div>`);
    stockList.appendChild(row);
  });
  c.appendChild(stockList);

  const dueTaps = S.taps.filter(tp=>tapCleanInfo(tp).overdue && (S.beerZoneFilter==='all' || tp.zone===S.beerZoneFilter));
  if(dueTaps.length>0){
    c.appendChild(el(`<h2 class="sec">${esc(t('beer_taps_need_clean'))}</h2>`));
    const cleanList=el('<div class="list"></div>');
    dueTaps.forEach(tp=>{
      const info=tapCleanInfo(tp);
      const row=el(`<div class="list-row" style="cursor:default;"><div class="lr-main"><div class="lr-title">${esc(tp.name)}</div><div class="lr-sub">${info.daysSince!=null?esc(t('beer_days_since_clean_prefix'))+info.daysSince+esc(t('beer_days_since_clean_suffix')):esc(t('beer_never_cleaned'))}</div></div></div>`);
      const btn=el(`<button class="btn sm ok">${esc(t('btn_mark_cleaned'))}</button>`);
      btn.onclick=async(ev)=>{ ev.stopPropagation(); try{ await S.db.doc('taps/'+tp.id).update({lastCleanedAt:new Date().toISOString()}); toast(t('toast_saved')); }catch(e){toast(dbErrMsg(e));} };
      row.appendChild(btn);
      cleanList.appendChild(row);
    });
    c.appendChild(cleanList);
  }

  const pendingDeposit = S.kegs.filter(k=>k.status==='empty' && k.depositStatus==='held');
  if(pendingDeposit.length>0){
    c.appendChild(el(`<h2 class="sec">${esc(t('beer_pending_deposit'))}</h2>`));
    const depList=el('<div class="list"></div>');
    pendingDeposit.forEach(k=>{
      const p=byId(S.beerProducts,k.productId);
      const row=el(`<div class="list-row" style="cursor:default;"><div class="lr-main"><div class="lr-title">${esc(p?p.name:t('deleted_placeholder'))}</div><div class="lr-sub">${k.batchNo?esc(k.batchNo)+' · ':''}${fmtDateTime(k.emptiedAt||k.createdAt)}</div></div></div>`);
      const btn=el(`<button class="btn sm ok">${esc(t('btn_mark_deposit_returned'))}</button>`);
      btn.onclick=async(ev)=>{ ev.stopPropagation(); try{ await S.db.doc('kegs/'+k.id).update({depositStatus:'returned'}); toast(t('toast_saved')); }catch(e){toast(dbErrMsg(e));} };
      row.appendChild(btn);
      depList.appendChild(row);
    });
    c.appendChild(depList);
  }

  return c;
}

/* ============================ MEMOS (公告) ============================ */
function memoReadMap(empId){ const d=byId(S.memoReads, empId); return (d && d.readIds) || {}; }
function memoIsReadBy(memoId, empId){ return !!memoReadMap(empId)[memoId]; }
function memoAudienceMembers(m){
  const active=S.employees.filter(e=>e.active!==false);
  return m.audience==='all' ? active : active.filter(e=>e.homeBranch===m.audience);
}
function memoVisibleTo(m, e){
  if(!e) return false;
  if(e.role==='admin') return true;
  return m.audience==='all' || m.audience===e.homeBranch;
}
function visibleMemos(){
  const e=currentEmployee();
  return S.memos.filter(m=>memoVisibleTo(m,e)).sort((a,b)=>{
    if(!!a.important!==!!b.important) return a.important?-1:1;
    return a.createdAt<b.createdAt?1:-1;
  });
}
function memoRow(m){
  const e=currentEmployee();
  const unread = !memoIsReadBy(m.id, e.id);
  const members=memoAudienceMembers(m);
  const readCount=members.filter(x=>memoIsReadBy(m.id,x.id)).length;
  const audienceLabel = m.audience==='all' ? t('memo_audience_all') : m.audience;
  const stats = canManageStaff() ? ` · ${t('memo_read_stats_prefix')}${readCount}/${members.length}` : '';
  const pill = m.important ? `<span class="pill critical">${esc(t('memo_important'))}</span>` : (unread ? `<span class="pill accent">${esc(t('memo_unread'))}</span>` : '');
  const row=el(`<div class="list-row">${m.image?`<img class="lr-thumb" src="${m.image}">`:ib('megaphone', m.important?'c-red':'c-orange')}<div class="lr-main"><div class="lr-title" style="${unread?'':'font-weight:500;'}">${esc(m.title)}</div><div class="lr-sub">${esc(m.authorName||'')} · ${fmtDateTime(m.createdAt)} · ${esc(audienceLabel)}${esc(stats)}</div></div>${pill}</div>`);
  row.onclick=()=>openMemoDetail(m);
  return row;
}
function memosView(){
  const c=el('<div></div>');
  const head=el(`<div class="sec-row"><h2 class="sec">${esc(t('memos_title'))}</h2></div>`);
  if(canManageStaff()){
    const post=el(`<button class="sec-link">${ICONS.plus} ${esc(t('btn_post_memo'))}</button>`);
    post.onclick=()=>openMemoForm();
    head.appendChild(post);
  }
  c.appendChild(head);
  const list=el('<div class="list"></div>');
  const memos=visibleMemos();
  if(memos.length===0) list.appendChild(el(`<div class="empty">${ICONS.inbox}<div>${esc(t('empty_no_memos'))}</div></div>`));
  memos.forEach(m=>list.appendChild(memoRow(m)));
  c.appendChild(list);
  return c;
}
async function markMemoRead(memoId){
  const e=currentEmployee(); if(!e) return;
  const cur=memoReadMap(e.id);
  if(cur[memoId]) return;
  const readIds=Object.assign({}, cur, {[memoId]:new Date().toISOString()});
  try{ await S.db.doc('memoReads/'+e.id).set({employeeId:e.id, employeeName:e.name, readIds}); }catch(err){ console.warn(err); }
}
function openMemoDetail(m){
  const e=currentEmployee();
  const body=el('<div></div>');
  const audienceLabel = m.audience==='all' ? t('memo_audience_all') : m.audience;
  body.innerHTML=`<div class="row" style="margin-bottom:8px;">${m.important?`<span class="pill critical">${esc(t('memo_important'))}</span>`:''}<span class="pill n">${esc(audienceLabel)}</span></div>
    <div class="hint">${esc(t('memo_posted_by'))}${esc(m.authorName||'')} · ${fmtDateTime(m.createdAt)}</div>
    <div class="memo-body">${esc(m.body||'')}</div>`;
  if(m.image) body.appendChild(el(`<img class="photow" src="${m.image}">`));
  if(canManageStaff()){
    const members=memoAudienceMembers(m);
    const unreadPeople=members.filter(x=>!memoIsReadBy(m.id,x.id));
    body.appendChild(el('<div class="divider"></div>'));
    body.appendChild(el(`<div style="font-weight:800; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;">${esc(t('memo_read_stats_prefix'))}${members.length-unreadPeople.length}/${members.length}</div>`));
    body.appendChild(el(`<p class="hint" style="margin-top:0;">${unreadPeople.length? esc(t('memo_unread_by'))+'：'+esc(unreadPeople.map(x=>x.name).join('、')) : esc(t('memo_all_read'))}</p>`));
    if(isAdmin() || m.authorId===e.id){
      const del=el(`<button class="btn danger block" style="margin-top:10px;">${esc(t('btn_delete_memo'))}</button>`);
      del.onclick=async()=>{ if(!confirm(t('confirm_delete_memo'))) return; try{ await S.db.doc('memos/'+m.id).delete(); toast(t('toast_deleted')); closeSheet(); }catch(err){ toast(dbErrMsg(err)); } };
      body.appendChild(del);
    }
  }
  openSheet(m.title, body);
  markMemoRead(m.id);
}

      await S.db.collection('memos').add({title:v.title.trim(), body:v.body.trim(), audience:v.audience||'all', important:v.priority==='important', image:photoWrap.getPhoto(), authorId:e.id, authorName:e.name, createdAt:new Date().toISOString()});
      toast(t('toast_memo_posted')); closeSheet();
    }catch(err){ toast(dbErrMsg(err)); btn.disabled=false; btn.textContent=t('btn_post_memo'); }
  };
  foot.appendChild(btn); body.appendChild(foot);
  openSheet(t('sheet_post_memo'), body);
}

/* ============================ NOTIFICATIONS ============================ */
function buildNotifications(){
  const e=currentEmployee(); if(!e) return [];
  const seen = (byId(S.notifSeen, e.id)||{}).at || e.notifSeenAt || '';
  const out=[];
  visibleMemos().forEach(m=>{
    out.push({id:'memo:'+m.id, ts:m.createdAt, title:t('notif_new_memo')+'：'+m.title, sub:(m.authorName||'')+' · '+fmtDateTime(m.createdAt),
      unread:!memoIsReadBy(m.id,e.id), onClick:()=>openMemoDetail(m)});
  });
  S.leaveRequests.filter(l=>l.employeeId===e.id && l.status!=='pending' && l.reviewedAt).forEach(l=>{
    out.push({id:'leave:'+l.id, ts:l.reviewedAt, title:l.status==='approved'?t('notif_leave_approved'):t('notif_leave_rejected'),
      sub:l.startDate+(l.endDate&&l.endDate!==l.startDate?' ~ '+l.endDate:''), unread:l.reviewedAt>seen, onClick:()=>{ location.hash='#me'; }});
  });
  S.schedules.filter(s=>s.employeeId===e.id && s.createdAt && s.date>=todayStr()).forEach(s=>{
    out.push({id:'sched:'+s.id, ts:s.createdAt, title:t('notif_new_schedule'), sub:s.date+' '+(s.shiftStart||'')+' - '+(s.shiftEnd||''), unread:s.createdAt>seen, onClick:()=>{ location.hash='#me'; }});
  });
  if(canManageStaff()){
    const scopeIds = isAdmin() ? null : new Set(S.employees.filter(x=>x.homeBranch===myBranch()).map(x=>x.id));
    S.leaveRequests.filter(l=>l.status==='pending' && (!scopeIds || scopeIds.has(l.employeeId))).forEach(l=>{
      out.push({id:'pending:'+l.id, ts:l.createdAt, title:t('notif_pending_leave')+'：'+l.employeeName, sub:l.startDate, unread:l.createdAt>seen, onClick:()=>{ location.hash='#me'; }});
    });
  }
  S.punchRequests.filter(r=>r.employeeId===e.id && r.status!=='pending' && r.reviewedAt).forEach(r=>{
    out.push({id:'punch:'+r.id, ts:r.reviewedAt, title:r.status==='approved'?t('notif_punch_approved'):t('notif_punch_rejected'), sub:punchSummary(r), unread:r.reviewedAt>seen, onClick:()=>{ location.hash='#me'; }});
  });
  S.swapRequests.filter(r=>r.employeeId===e.id && r.status!=='pending' && r.reviewedAt).forEach(r=>{
    out.push({id:'swap:'+r.id, ts:r.reviewedAt, title:r.status==='approved'?t('notif_swap_approved'):t('notif_swap_rejected'), sub:swapSummary(r), unread:r.reviewedAt>seen, onClick:()=>{ location.hash='#me'; }});
  });
  if(canManageStaff()){
    const scopeIds2 = isAdmin() ? null : new Set(S.employees.filter(x=>x.homeBranch===myBranch()).map(x=>x.id));
    S.punchRequests.filter(r=>r.status==='pending' && (!scopeIds2 || scopeIds2.has(r.employeeId))).forEach(r=>{ out.push({id:'ppunch:'+r.id, ts:r.createdAt, title:t('notif_pending_punch')+'：'+r.employeeName, sub:punchSummary(r), unread:r.createdAt>seen, onClick:()=>{ location.hash='#me'; }}); });
    S.swapRequests.filter(r=>r.status==='pending' && (!scopeIds2 || scopeIds2.has(r.employeeId))).forEach(r=>{ out.push({id:'pswap:'+r.id, ts:r.createdAt, title:t('notif_pending_swap')+'：'+r.employeeName, sub:swapSummary(r), unread:r.createdAt>seen, onClick:()=>{ location.hash='#me'; }}); });
  }
  if(canManageStaff()){
    const scopeIds3 = isAdmin() ? null : new Set(S.employees.filter(x=>x.homeBranch===myBranch()).map(x=>x.id));
    docExpiryItems(scopeIds3, 60).forEach(it=>{ const ts=new Date(new Date(it.date).getTime()-60*86400000).toISOString(); out.push({id:'docexp:'+it.emp.id+':'+it.field, ts, title:t('notif_doc_expiry')+'：'+it.emp.name+' · '+it.label, sub:it.date+' · '+docDaysLabel(it.days), unread:ts>seen, onClick:()=>{ location.hash='#me'; }}); });
    const since24=new Date(Date.now()-24*3600000).toISOString();
    S.tempLogs.filter(l=>l.ok===false && l.createdAt>=since24 && (isAdmin() || l.branch===myBranch())).forEach(l=>{ out.push({id:'temp:'+l.id, ts:l.createdAt, title:t('notif_temp_alert')+'：'+l.equipmentName+' '+l.value+'°C', sub:(l.branch||'')+' · '+(l.employeeName||'')+' · '+fmtDateTime(l.createdAt), unread:l.createdAt>seen, onClick:()=>{ S.taskBranch=l.branch; location.hash='#tasks'; }}); });
  }
  if(canManageStaff()){
    const mineB = b => isAdmin() || b===myBranch();
    S.safetyChecks.filter(s=>s.status==='sos' && mineB(s.branch)).forEach(s=>{ out.push({id:'sos:'+s.id, ts:s.createdAt, title:'🆘 '+t('notif_sos')+'：'+s.employeeName, sub:(s.branch||'')+' · '+fmtDateTime(s.createdAt)+(s.geo?' · '+s.geo.lat.toFixed(5)+','+s.geo.lng.toFixed(5):''), unread:s.createdAt>seen, onClick:()=>{ if(s.geo) window.open('https://maps.google.com/?q='+s.geo.lat+','+s.geo.lng,'_blank'); }}); });
    S.incidents.filter(i=>i.status==='open' && mineB(i.branch)).forEach(i=>{ out.push({id:'inc:'+i.id, ts:i.createdAt, title:t('notif_incident')+'：'+incidentKindLabel(i.kind)+' · '+(i.branch||''), sub:(i.employeeName||'')+' · '+(i.description||'').slice(0,60), unread:i.createdAt>seen, onClick:()=>openIncidentDetail(i)}); });
    if(isNightNow()){ S.employees.filter(x=>x.active!==false && mineB(x.homeBranch) && isClockedIn(x.id)).forEach(x=>{ const due=safetyDueMin(x.id); if(due!=null && due<=-15){ const ts=new Date(Date.now()+due*60000).toISOString(); out.push({id:'safety:'+x.id+':'+ts.slice(0,13), ts, title:t('notif_safety_missed')+'：'+x.name, sub:(x.homeBranch||'')+' · '+Math.abs(due)+' min', unread:ts>seen, onClick:()=>{}}); } }); }
  }
  if(isAdmin()){
    S.faults.filter(f=>f.status==='open').forEach(f=>{
      out.push({id:'fault:'+f.id, ts:f.createdAt, title:t('notif_new_fault')+'：'+devName(f.deviceId), sub:f.description||'', unread:f.createdAt>seen, onClick:()=>{ location.hash='#equip'; }});
    });
  }
  if(canManageStaff()){
    S.kegs.filter(k=>k.status==='tapped').forEach(k=>{
      const p=byId(S.beerProducts,k.productId); const fr=kegFreshness(k,p);
      if(fr && (fr.expired||fr.soon)){
        const ts=new Date(fr.expiry.getTime()-48*3600000).toISOString();
        out.push({id:'keg:'+k.id, ts, title:(fr.expired?t('notif_keg_expired'):t('notif_keg_expiring'))+'：'+(p?p.name:''), sub:tapName(k.tapId), unread:ts>seen, onClick:()=>{ S.stockSection='beer'; location.hash='#stock'; }});
      }
    });
  }
  out.sort((a,b)=>a.ts<b.ts?1:-1);
  return out.slice(0,60);
}
function openNotifSheet(){
  const e=currentEmployee();
  const items=buildNotifications();
  const body=el('<div></div>');
  if(items.length===0) body.appendChild(el(`<div class="empty">${ICONS.inbox}<div>${esc(t('notif_empty'))}</div></div>`));
  items.forEach(n=>{
    const row=el(`<div class="notif-row"><span class="notif-dot ${n.unread?'':'seen'}"></span>${notifIcon(n.id)}<div class="lr-main"><div class="lr-title" style="white-space:normal; ${n.unread?'':'font-weight:500;'}">${esc(n.title)}</div><div class="lr-sub" style="white-space:normal;">${esc(n.sub||'')}</div></div></div>`);
    row.onclick=()=>{ closeSheet(); n.onClick && n.onClick(); renderApp(); };
    body.appendChild(row);
  });
  openSheet(t('notif_title'), body);
  // Everything currently listed counts as seen from now on (memos stay unread until opened).
  S.db.doc('notifSeen/'+e.id).set({at:new Date().toISOString()}).catch(()=>{});
}
function maybeBrowserNotify(){
  const items=buildNotifications();
  const ids=new Set(items.map(n=>n.id));
  if(S.notifKnown===null){ S.notifKnown=ids; return; } // first paint: don't fire for history
  if(S.notifBrowser && self.Notification && Notification.permission==='granted'){
    items.forEach(n=>{ if(!S.notifKnown.has(n.id) && n.unread && n.ts>S.pageLoadedAt){ try{ new Notification(n.title, {body:n.sub||''}); }catch(e){} } });
  }
  S.notifKnown=ids;
}
async function toggleBrowserNotif(){
  if(!self.Notification){ toast(t('notif_unsupported')); return; }
  if(S.notifBrowser){ S.notifBrowser=false; LS.set('bgc_notif','0'); renderApp(); return; }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){ S.notifBrowser=true; LS.set('bgc_notif','1'); toast(t('toast_notif_enabled')); }
  else toast(t('toast_notif_denied'));
  renderApp();
}

/* ============================ EQUIP ============================ */
function equipView(){
  const c=el('<div></div>');
  c.appendChild(el(`<h2 class="sec">${esc(t('equip_title'))}</h2>`));
  const seg=el(`<div class="seg" style="margin-bottom:14px;">
    <button data-v="devices" class="${S.equipTab==='devices'?'on':''}">${esc(t('tab_devices'))}</button>
    <button data-v="faults" class="${S.equipTab==='faults'?'on':''}">${esc(t('tab_faults'))}</button>
    <button data-v="inspections" class="${S.equipTab==='inspections'?'on':''}">${esc(t('tab_inspections'))}</button></div>`);
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.equipTab=b.dataset.v; renderApp(); });

  else if(S.equipTab==='faults') c.appendChild(equipFaults());

function equipDevices(){
  const c=el('<div></div>');
  if(S.devices.length===0){ c.appendChild(el(`<div class="empty">${ICONS.wrench}<div>${esc(t('empty_add_device'))}</div></div>`)); return c; }
  groupByZone(S.devices).forEach(([zone, devices])=>{
    c.appendChild(el(`<div style="margin:14px 0 8px; font-weight:900; font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;">${esc(zone)}</div>`));
    const list=el('<div class="list"></div>');
    devices.forEach(d=>{
      const openF = S.faults.filter(f=>f.deviceId===d.id && f.status!=='resolved').length;
      const lastInsp = S.inspections.find(i=>i.deviceId===d.id);
      const row=el(`<div class="list-row"><div class="lr-main"><div class="lr-title">${esc(d.name)}</div><div class="lr-sub">${d.machineId?esc(t('label_device_id'))+esc(d.machineId)+' · ':''}${esc(d.location||'')}${lastInsp?esc(t('device_last_insp'))+fmtDateTime(lastInsp.createdAt):esc(t('device_no_insp'))}</div></div>
