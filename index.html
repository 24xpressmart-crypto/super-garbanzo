function openDeviceActions(d){
  const body=el('<div></div>');
  const row=el('<div class="row"></div>');
  const bInsp=el(`<button class="btn block">${ICONS.pin}<span>${esc(t('btn_inspect'))}</span></button>`);
  const bFault=el(`<button class="btn danger block">${ICONS.wrench}<span>${esc(t('btn_report_fault2'))}</span></button>`);
  bInsp.onclick=()=>{ closeSheet(); setTimeout(()=>openInspectionForm(d),150); };
  bFault.onclick=()=>{ closeSheet(); setTimeout(()=>openFaultForm(d),150); };
  row.appendChild(bInsp); row.appendChild(bFault);
  body.appendChild(row);
  const recent = [...S.faults.filter(f=>f.deviceId===d.id), ...S.inspections.filter(i=>i.deviceId===d.id).map(i=>Object.assign({__insp:true},i))]
    .sort((a,b)=>b.createdAt<a.createdAt?-1:1).slice(0,8);
  body.appendChild(el('<div class="divider"></div>'));
  body.appendChild(el(`<div style="font-weight:800; font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;">${esc(t('recent_activity'))}</div>`));
  const list=el('<div class="list"></div>');
  recent.forEach(r=>{
    if(r.__insp){ list.appendChild(el(`<div class="list-row" style="cursor:default;"><div class="lr-main"><div class="lr-title">${esc(t('insp_by'))}${esc(r.employeeName)}</div><div class="lr-sub">${fmtDateTime(r.createdAt)}</div></div>${r.issuesFound?`<span class="pill warn">${esc(t('flag_issue'))}</span>`:`<span class="pill ok">${esc(t('device_ok'))}</span>`}</div>`)); }
    else { list.appendChild(el(`<div class="list-row" style="cursor:default;"><div class="lr-main"><div class="lr-title">${esc(t('fault_by'))}${esc(r.description||'')}</div><div class="lr-sub">${fmtDateTime(r.createdAt)}</div></div><span class="pill ${FAULT_STATUS[r.status].c}">${esc(t(FAULT_STATUS[r.status].t))}</span></div>`)); }
  });
  if(recent.length===0) list.appendChild(el(`<div class="hint">${esc(t('empty_no_records'))}</div>`));
  body.appendChild(list);
  openSheet(d.name, body);
}
function openInspectionForm(device){
  const body=el('<div></div>');
  if(!device){
    body.appendChild(el(`<label class="field"><span class="fl">${esc(t('field_pick_device'))}</span></label>`));
  }
  const devSelWrap=el(`<label class="field"><span class="fl">${esc(t('field_device'))}</span></label>`);
  const devSel=el('<select></select>');
  S.devices.forEach(d=>devSel.appendChild(el(`<option value="${d.id}" ${device&&device.id===d.id?'selected':''}>${esc(d.name)}</option>`)));
  devSelWrap.appendChild(devSel); body.appendChild(devSelWrap);

  const results={};
  INSPECTION_ITEMS.forEach(item=>{
    results[item.key]=true;
    const row=el(`<div class="row" style="justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border);"><span style="font-size:13.5px;">${esc(t(item.label))}</span></div>`);
    const seg=el(`<div class="seg" style="width:132px;"><button class="on" data-v="ok">${esc(t('item_ok'))}</button><button data-v="bad">${esc(t('item_bad'))}</button></div>`);
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ results[item.key]= b.dataset.v==='ok'; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
    row.appendChild(seg);
    body.appendChild(row);
  });
  const noteWrap=el(`<label class="field" style="margin-top:12px;"><span class="fl">${esc(t('field_note_opt'))}</span></label>`);
  const noteInput=el(`<textarea placeholder="${esc(t('ph_insp_note'))}"></textarea>`);
  noteWrap.appendChild(noteInput); body.appendChild(noteWrap);
  const photo=photoPicker(); body.appendChild(photo);

  const foot=el('<div class="sheet-foot"></div>');
  const submitBtn=el(`<button class="btn primary block">${esc(t('btn_submit_insp'))}</button>`);
  submitBtn.onclick=async ()=>{
    const devId = devSel.value;
    if(!devId){ toast(t('err_pick_device')); return; }
    const issuesFound = Object.values(results).some(v=>v===false);
    submitBtn.disabled=true; submitBtn.textContent=t('toast_submitting');
    const e=currentEmployee();
    const rec={deviceId:devId, employeeId:e.id, employeeName:e.name, createdAt:new Date().toISOString(), checklist:results, issuesFound, note:noteInput.value||''};
    const p=photo.getPhoto(); if(p) rec.photo=p;
    try{
      await S.db.collection('inspections').add(rec);
      toast(t('toast_insp_submitted'));
      closeSheet();
      if(issuesFound){ setTimeout(()=>{ if(confirm(t('confirm_issue_fault'))) openFaultForm(byId(S.devices,devId)); },200); }
    }catch(err){ toast(dbErrMsg(err)); submitBtn.disabled=false; submitBtn.textContent=t('btn_submit_insp'); }
  };
  foot.appendChild(submitBtn); body.appendChild(foot);
  openSheet(t('sheet_inspect'), body);
}
function openFaultForm(device){
  const body=el('<div></div>');
  const devSelWrap=el(`<label class="field"><span class="fl">${esc(t('field_device'))}</span></label>`);
  const devSel=el('<select></select>');

  const sevSel=el(`<select><option value="low">${esc(t('sev_low'))}</option><option value="medium" selected>${esc(t('sev_medium'))}</option><option value="high">${esc(t('sev_high'))}</option></select>`);

function toCSV(rows, cols){
  const head = cols.join(',');
  const body = rows.map(r=>cols.map(c=>{
    let v=r[c]; if(v==null) v='';
    v=String(v).replace(/"/g,'""');
    return /[",\n]/.test(v) ? '"'+v+'"' : v;
  }).join(',')).join('\n');
  return '﻿'+head+'\n'+body;
}
function toggleSwitch(checked, onChange){
  const wrap=el(`<label class="switch"><input type="checkbox" ${checked?'checked':''}><span class="track"></span><span class="knob"></span></label>`);
  wrap.querySelector('input').onclick=(ev)=>{ ev.stopPropagation(); onChange(ev.target.checked); };
  return wrap;
}

function resolveZone(zone, rest){
  // Bare "P8" isn't a real zone by itself: P8 (1) is actually in P8W,
  // every other P8 (n) — and bare "P8" with no number — is P8A.
  if(zone.toUpperCase()==='P8') return rest==='(1)' ? 'P8W' : 'P8A';
  return zone;
}
function parseDeviceLine(line){
  line = line.trim();
  if(!line) return null;
  let machineId='', rawLabel=line;
  const tabParts = line.split('\t').map(s=>s.trim()).filter(Boolean);
  if(tabParts.length>=2){ machineId=tabParts[0]; rawLabel=tabParts.slice(1).join(' '); }
  else {
    const m2 = line.match(/^(\S+)\s{2,}(.+)$/);
    if(m2){ machineId=m2[1]; rawLabel=m2[2]; }
    else {
      const idx = line.indexOf(' ');
      if(idx>0 && /^[0-9]{4,}$/.test(line.slice(0,idx))){ machineId=line.slice(0,idx).trim(); rawLabel=line.slice(idx+1).trim(); }
    }
  }
  const m = rawLabel.match(/^([A-Za-z0-9]+)\s*(.*)$/);
  let zone = m ? m[1] : rawLabel;
  const rest = m ? m[2].trim() : '';
  zone = resolveZone(zone, rest);
  const name = rest ? zone+' '+rest : zone;
  return {machineId, zone, name};
}

  // Store branches known to the app: employees' home branches plus site records that are not vending zones.
  const zones = new Set(zoneList());

  S.sites.forEach(s=>{ if(!zones.has(s.id)) set.add(s.id); });

function siteCoordsFor(branch){ const s=siteFor(branch||''); return (s && s.lat!=null && s.lng!=null && s.lat!=='' && s.lng!=='') ? {lat:Number(s.lat), lng:Number(s.lng)} : null; }
function defaultClockBranch(){ if(S.clockBranch!=null) return S.clockBranch; return myBranch()||''; }
function branchGeoInfo(geo, branch){
  if(!geo || geo.error || !branch) return null;
  const c=siteCoordsFor(branch); if(!c) return null;
  const dist=Math.round(haversine(geo.lat,geo.lng,c.lat,c.lng));
  return {configured:true, branch, distance:dist, inRange: dist<=(S.settings.geofenceRadius||300)};
}

function computeReportDetail(){
  const d=S.reportData; if(!d) return [];
  const scope=new Set(reportScopeEmployees().map(e=>e.id));
  const byEmpDay={};
  d.att.filter(a=>scope.has(a.employeeId)).forEach(a=>{ const day=todayStr(new Date(a.createdAt)); const k=a.employeeId+'|'+day; (byEmpDay[k]=byEmpDay[k]||[]).push(a); });
  const out=[];
  Object.keys(byEmpDay).sort().forEach(k=>{
    const [empId, day]=k.split('|'); const emp=byId(S.employees,empId);
    const recs=byEmpDay[k].sort((a,b)=>a.createdAt<b.createdAt?-1:1);
    let openIn=null, minutes=0, firstIn=null, lastOut=null; const branches=new Set(); let cover=false, manual=false;
    recs.forEach(r=>{ const tm=new Date(r.createdAt); if(r.branch) branches.add(r.branch); if(r.cover) cover=true; if(r.manual) manual=true;
      if(r.type==='in'){ openIn=tm; if(!firstIn) firstIn=tm; } else { if(openIn){ minutes+=(tm-openIn)/60000; openIn=null; } lastOut=tm; } });
    out.push({date:day, name:emp?emp.name:recs[0].employeeName, homeBranch:emp?(emp.homeBranch||''):'', workedAt:[...branches].join('/'), in:firstIn?fmtTime(firstIn.toISOString()):'', out:lastOut?fmtTime(lastOut.toISOString()):'', hours:(minutes/60).toFixed(2), cover:cover?'Y':'', manual:manual?'Y':'', punches:recs.length});
  });
  return out.sort((a,b)=>a.name.localeCompare(b.name,'zh') || (a.date<b.date?-1:1));
}

const SHIFT_KINDS=['open','mid','close'];
function shiftKindLabel(k){ return t('shift_'+(SHIFT_KINDS.includes(k)?k:'open')); }
function taskBranch(){ if(S.taskBranch!=null) return S.taskBranch; return defaultClockBranch() || ''; }
function templatesForBranch(branch){
  return S.taskTemplates.filter(tp=>tp.active!==false && (!tp.branches || tp.branches==='all' || String(tp.branches).split(',').map(s=>s.trim().toUpperCase()).includes(String(branch).toUpperCase())))
    .sort((a,b)=>SHIFT_KINDS.indexOf(a.shift)-SHIFT_KINDS.indexOf(b.shift) || (a.name||'').localeCompare(b.name||'','zh'));
}
function runIdFor(tp, branch, date){ return (tp.id+'__'+branch+'__'+date).replace(/[^A-Za-z0-9_\-]/g,'-'); }
function runFor(tp, branch, date){ return byId(S.taskRuns, runIdFor(tp,branch,date)); }
function runProgress(run, tp){ const items=run?run.items:(tp.items||[]); const done=items.filter(i=>i.done).length; return {done, total:items.length}; }
function runStatus(run, tp){ if(!run) return 'not_started'; if(run.status==='done') return 'done'; return runProgress(run,tp).done>0?'in_progress':'not_started'; }
const TASK_STATUS={not_started:{t:'task_not_started',c:'n'}, in_progress:{t:'task_in_progress',c:'warn'}, done:{t:'task_done',c:'ok'}};
async function saveRun(run){ const {id, ...data}=run; await S.db.doc('taskRuns/'+id).set(data); }
function newRun(tp, branch, date){

    c.appendChild(hl);

  return c;

function openTaskRun(tp, branch, date){
  const me=currentEmployee();
  let run = runFor(tp,branch,date) || newRun(tp,branch,date);
  run = JSON.parse(JSON.stringify(run));
  const body=el('<div></div>');
  body.appendChild(el(`<div class="hint" style="margin-bottom:8px;">${esc(branch)} · ${date} · ${esc(shiftKindLabel(tp.shift))}</div>`));
  const list=el('<div class="list"></div>'); body.appendChild(list);
  const foot=el('<div class="sheet-foot"></div>');
  const doneBtn=el('<button class="btn primary block"></button>');
  let saving=false;
  async function persist(){ if(saving) return; saving=true; try{ await saveRun(run); }catch(e){ toast(dbErrMsg(e)); } saving=false; }
  function refresh(){
    list.innerHTML='';
    run.items.forEach(it=>{
      const row=el(`<div class="list-row" style="align-items:flex-start; cursor:default;"><button class="btn sm ${it.done?'ok':''}" style="flex-shrink:0; min-width:44px;">${it.done?'✓':''}</button><div class="lr-main"><div class="lr-title" style="white-space:normal; ${it.done?'color:var(--ink-faint); text-decoration:line-through;':''}">${esc(it.text)}</div><div class="lr-sub">${it.photo?esc(t('task_photo_required')):''}${it.by?' · '+esc(it.by)+' '+fmtTime(it.at):''}</div></div></div>`);
      const tick=row.querySelector('button');
      tick.onclick=async ()=>{
        if(run.status==='done') return;
        if(!it.done && it.photo && !it.photoUrl){ toast(t('task_need_photo')); return; }
        it.done=!it.done; it.by=it.done?me.name:''; it.at=it.done?new Date().toISOString():'';
        refresh(); await persist();
      };
      if(it.photo && run.status!=='done'){
        const pw=photoPicker(async (url)=>{ if(url){ it.photoUrl=url; it.done=true; it.by=me.name; it.at=new Date().toISOString(); refresh(); await persist(); } }, true, it.photoUrl||null);
        pw.style.width='100%'; row.querySelector('.lr-main').appendChild(pw);
      } else if(it.photoUrl){ row.querySelector('.lr-main').appendChild(el(`<img class="photow" src="${it.photoUrl}" style="max-width:160px;">`)); }
      list.appendChild(row);
    });
    const p=runProgress(run,tp);
    if(run.status==='done'){ doneBtn.textContent=t('task_done')+' · '+(run.completedBy||'')+' '+fmtTime(run.completedAt||run.createdAt); doneBtn.disabled=true; }
    else { doneBtn.textContent=t('btn_complete_checklist')+' ('+p.done+'/'+p.total+')'; doneBtn.disabled = p.done<p.total; }
  }
  doneBtn.onclick=async ()=>{
    run.status='done'; run.completedBy=me.name; run.completedById=me.id; run.completedAt=new Date().toISOString();
    doneBtn.disabled=true;
    try{ await saveRun(run); toast(t('toast_checklist_done')); closeSheet(); }catch(e){ toast(dbErrMsg(e)); doneBtn.disabled=false; }
  };
  refresh();
  foot.appendChild(doneBtn); body.appendChild(foot);
  openSheet(tp.name, body);
}

function tempOk(eq, v){ if(v==null||isNaN(v)) return true; if(hasNum(eq.min) && v<Number(eq.min)) return false; if(hasNum(eq.max) && v>Number(eq.max)) return false; return true; }

async function copyLastWeek(emps, days){
  const ids=new Set(emps.map(e=>e.id));
  const prevDays=days.map(d=>todayStr(addDays(d,-7)));
  const thisDays=days.map(d=>todayStr(d));
  const src=S.schedules.filter(s=>ids.has(s.employeeId) && prevDays.includes(s.date));
  if(src.length===0){ toast(t('toast_no_last_week')); return; }
  const existing=new Set(S.schedules.filter(s=>ids.has(s.employeeId) && thisDays.includes(s.date)).map(s=>s.employeeId+'|'+s.date+'|'+s.shiftStart));
  const toAdd=src.map(s=>({employeeId:s.employeeId, date:todayStr(addDays(localDate(s.date),7)), shiftStart:s.shiftStart, shiftEnd:s.shiftEnd, branch:s.branch||'', note:s.note||'', createdAt:new Date().toISOString(), createdBy:currentEmployee().name})).filter(s=>!existing.has(s.employeeId+'|'+s.date+'|'+s.shiftStart));
  if(toAdd.length===0){ toast(t('toast_week_already')); return; }
  if(!confirm(t('confirm_copy_week_prefix')+toAdd.length+t('confirm_copy_week_suffix'))) return;
  try{ for(const s of toAdd){ await S.db.collection('schedules').add(s); } toast(t('toast_added')); }catch(e){ toast(dbErrMsg(e)); }
}
/* ---- night safety ---- */
function minsOf(tm){ const [h,m]=String(tm||'').split(':').map(Number); return isNaN(h)?null:h*60+(m||0); }
function isNightNow(d){ d=d||new Date(); const now=d.getHours()*60+d.getMinutes(); const a=minsOf(S.settings.nightStart||'23:00'), b=minsOf(S.settings.nightEnd||'07:00'); if(a==null||b==null) return false; return a>b ? (now>=a || now<b) : (now>=a && now<b); }
function lastClockIn(empId){ return S.attendance.filter(a=>a.employeeId===empId && a.type==='in')[0]; }
function isClockedIn(empId){ const t0=S.attendance.filter(a=>a.employeeId===empId)[0]; return !!(t0 && t0.type==='in' && (Date.now()-new Date(t0.createdAt).getTime())<16*3600000); }
function safetyDueMin(empId){
  const iv=Number(S.settings.safetyIntervalMin)||120;
  const last=S.safetyChecks.filter(s=>s.employeeId===empId && s.status==='ok')[0];
  const ci=lastClockIn(empId); if(!ci) return null;
  const base = last && new Date(last.createdAt) > new Date(ci.createdAt) ? new Date(last.createdAt) : new Date(ci.createdAt);
  return Math.round((base.getTime()+iv*60000-Date.now())/60000);
}
function safetyBlock(){
  const e=currentEmployee(); if(!e) return null;
  if(!isClockedIn(e.id) || !isNightNow()) return null;
  const due=safetyDueMin(e.id); const overdue = due!=null && due<=0;
  const card=el(`<div class="card card-tight" style="margin-top:12px; ${overdue?'border-color:var(--critical);':''}"><div class="lr-title">${esc(t('safety_title'))}</div><div class="lr-sub" style="white-space:normal;">${due==null?esc(t('safety_first')):(overdue?esc(t('safety_overdue')):esc(t('safety_next_prefix'))+due+esc(t('safety_next_suffix')))}</div></div>`);
  const b=el(`<button class="btn ${overdue?'primary':'ok'} block" style="margin-top:8px;">${esc(t('btn_safety_ok'))}</button>`);
  b.onclick=async()=>{ b.disabled=true; try{ await S.db.collection('safetyChecks').add({employeeId:e.id, employeeName:e.name, branch:defaultClockBranch()||e.homeBranch||'', status:'ok', createdAt:new Date().toISOString()}); toast(t('toast_safety_ok')); }catch(err){ toast(dbErrMsg(err)); b.disabled=false; } };

}

  body.appendChild(send);
  const phones=managerPhones(branch); if(S.settings.emergencyPhone) phones.push({name:t('sos_hq'), phone:S.settings.emergencyPhone});
  phones.forEach(p=>{ body.appendChild(el(`<a class="btn block" style="margin-bottom:8px; text-decoration:none;" href="${telHref(p.phone)}">☎ ${esc(p.name)} · ${esc(p.phone)}</a>`)); });
  body.appendChild(el(`<a class="btn block" style="text-decoration:none;" href="tel:999">☎ 999</a>`));
  openSheet(t('sheet_sos'), body);
}
/* ---- incidents ---- */
const INCIDENT_KINDS=['complaint','accident','theft','power','other'];
function incidentKindLabel(k){ return t('inc_'+(INCIDENT_KINDS.includes(k)?k:'other')); }
function openIncidentForm(){
  const e=currentEmployee(); const branches=allBranchIds();
  const f=[
    {key:'kind', label:t('field_incident_kind'), type:'select', options:INCIDENT_KINDS.map(k=>({v:k,l:incidentKindLabel(k)}))},
    {key:'branch', label:t('field_branch'), type:'select', options:branches.map(b=>({v:b,l:b}))},
    {key:'severity', label:t('field_severity'), type:'select', options:[{v:'low',l:t('sev_low')},{v:'medium',l:t('sev_medium')},{v:'high',l:t('sev_high')}]},
    {key:'description', label:t('field_description'), type:'textarea'},
  ];
  const body=el('<div>'+fieldsHTML(f,{branch:defaultClockBranch()||e.homeBranch||'', severity:'medium'})+'</div>');
  const pw=photoPicker(null,false); body.appendChild(pw);
  const foot=el('<div class="sheet-foot"></div>'); const btn=el(`<button class="btn primary block">${esc(t('btn_submit'))}</button>`);
  btn.onclick=async()=>{ const v=readFields(body,f); if(!v.description||!v.description.trim()){ toast(t('err_fill_all')); return; } btn.disabled=true; const rec=Object.assign({}, v, {description:v.description.trim(), employeeId:e.id, employeeName:e.name, status:'open', createdAt:new Date().toISOString()}); const photo=pw.getPhoto(); if(photo) rec.photo=photo; try{ await S.db.collection('incidents').add(rec); toast(t('toast_incident_sent')); closeSheet(); }catch(err){ toast(dbErrMsg(err)); btn.disabled=false; } };
  foot.appendChild(btn); body.appendChild(foot); openSheet(t('sheet_incident'), body);
}
function openIncidentDetail(i){
  const sv=SEVERITY[i.severity]||SEVERITY.medium;
  const body=el('<div></div>');
  body.innerHTML=`<div class="row" style="margin-bottom:8px;"><span class="pill ${sv.c}">${esc(t(sv.t))}</span><span class="pill ${i.status==='open'?'critical':'ok'}">${esc(i.status==='open'?t('inc_open'):t('inc_resolved'))}</span></div><div class="hint">${esc(incidentKindLabel(i.kind))} · ${esc(i.branch||'')} · ${esc(i.employeeName||'')} · ${fmtDateTime(i.createdAt)}</div><p style="white-space:pre-wrap;">${esc(i.description||'')}</p>${i.resolvedBy?`<div class="hint">${esc(t('inc_resolved'))} · ${esc(i.resolvedBy)} · ${fmtDateTime(i.resolvedAt)}</div>`:''}`;
  if(i.photo) body.appendChild(el(`<img class="photow" src="${i.photo}">`));
  if(canManageStaff() && i.status==='open'){ const b=el(`<button class="btn ok block" style="margin-top:10px;">${esc(t('btn_mark_resolved'))}</button>`); b.onclick=async()=>{ try{ await S.db.doc('incidents/'+i.id).update({status:'resolved', resolvedBy:currentEmployee().name, resolvedAt:new Date().toISOString()}); toast(t('toast_saved')); closeSheet(); }catch(e){ toast(dbErrMsg(e)); } }; body.appendChild(b); }
  openSheet(t('sheet_incident'), body);
}
function incidentsBlock(branch){
  const c=el('<div></div>');
  const rows=S.incidents.filter(i=>!branch || i.branch===branch).slice(0,12);
  c.appendChild(el(`<div class="sec-row"><h2 class="sec" style="margin:0;">${esc(t('admin_incidents'))}</h2></div>`));
  const list=el('<div class="list"></div>');
  if(rows.length===0) list.appendChild(el(`<div class="hint">${esc(t('empty_no_data'))}</div>`));
  rows.forEach(i=>{ const r=el(`<div class="list-row">${ib('alert','c-red')}<div class="lr-main"><div class="lr-title">${esc(incidentKindLabel(i.kind))}${!branch&&i.branch?' · '+esc(i.branch):''}</div><div class="lr-sub">${fmtDateTime(i.createdAt)} · ${esc(i.employeeName||'')} · ${esc((i.description||'').slice(0,40))}</div></div><span class="pill ${i.status==='open'?'critical':'ok'}">${esc(i.status==='open'?t('inc_open'):t('inc_resolved'))}</span></div>`); r.onclick=()=>openIncidentDetail(i); list.appendChild(r); });
  c.appendChild(list); return c;
}

/* ============================ VISUAL REFRESH: ICON BADGES, HELLO CARD, FUNCTION GRID ============================ */
function ib(icon, cls, size){ return `<span class="ib ${cls||'c-grey'} ${size||''}">${ICONS[icon]||''}</span>`; }
function secH(icon, cls, text){ return el(`<h2 class="sec">${ib(icon, cls, 'sm')}${esc(text)}</h2>`); }
function helloCard(e, clockedIn, last){
  const hr=new Date().getHours();
  const greet = t(hr<11?'hello_morning':(hr<17?'hello_afternoon':'hello_evening'));
  const status = clockedIn ? t('home_status_working') : (last ? t('home_status_off') : t('home_status_none'));
  const card=el(`<div class="hello"><span class="av">${esc(e.name.slice(0,1))}</span><div class="lr-main"><div class="g">${esc(greet)}，${esc(e.name)}</div><div class="s">${esc(e.homeBranch||'')}${e.homeBranch?' · ':''}${esc(e.jobTitle||(e.role==='admin'?t('role_admin'):e.role==='manager'?t('role_manager'):t('role_staff')))}</div></div><span class="pill ${clockedIn?'ok':'n'}" style="background:rgba(255,255,255,.18); color:#fff; border-color:transparent;">${esc(status)}</span></div>`);
  return card;
}
function funcGrid(clockedIn){
  const e=currentEmployee(); const branch=defaultClockBranch()||e.homeBranch||'';
  const unreadMemos = visibleMemos().filter(m=>!memoIsReadBy(m.id,e.id)).length;
  const scopeIds = isAdmin() ? null : new Set(S.employees.filter(x=>x.homeBranch===myBranch()).map(x=>x.id));
  const pendingCount = canManageStaff() ? (S.leaveRequests.filter(l=>l.status==='pending' && (!scopeIds||scopeIds.has(l.employeeId))).length + S.punchRequests.filter(r=>r.status==='pending' && (!scopeIds||scopeIds.has(r.employeeId))).length + S.swapRequests.filter(r=>r.status==='pending' && (!scopeIds||scopeIds.has(r.employeeId))).length) : 0;
  const hasBeer = S.taps.some(tp=>tp.zone===branch) || S.beerProducts.length>0 && (branch==='BR19'||branch==='BR20');
  const tiles=[
    {k:'clock', icon: clockedIn?'logout':'login', cls: clockedIn?'c-grey':'c-blue', label: clockedIn?t('tile_clock_out'):t('tile_clock_in'), go:()=>{ location.hash='#clock'; }},
    {k:'tasks', icon:'check', cls:'c-green', label:t('tile_tasks'), go:()=>{ location.hash='#tasks'; }},
    {k:'handover', icon:'handover', cls:'c-teal', label:t('tile_handover'), go:()=>{ if(branch) openHandoverForm(branch); else location.hash='#tasks'; }},
    {k:'temp', icon:'thermo', cls:'c-teal', label:t('tile_temp'), go:()=>{ location.hash='#tasks'; setTimeout(()=>{ const h=[...document.querySelectorAll('#view h2')].find(x=>x.textContent.includes(t('temp_title'))); if(h) h.scrollIntoView({behavior:'smooth'}); },300); }},
    {k:'leave', icon:'calendar', cls:'c-purple', label:t('tile_leave'), go:()=>openLeaveForm()},
    {k:'punch', icon:'clock', cls:'c-amber', label:t('tile_punch'), go:()=>openPunchRequestForm()},
    {k:'swap', icon:'swap', cls:'c-amber', label:t('tile_swap'), go:()=>openSwapRequestForm()},
    {k:'memos', icon:'megaphone', cls:'c-orange', label:t('tile_memos'), count:unreadMemos, go:()=>{ location.hash='#memos'; }},
    {k:'fault', icon:'wrench', cls:'c-orange', label:t('tile_fault'), go:()=>openFaultForm()},
    {k:'incident', icon:'alert', cls:'c-red', label:t('tile_incident'), go:()=>openIncidentForm()},
    {k:'sos', icon:'siren', cls:'c-red', label:t('tile_sos'), go:()=>openSosSheet()},
    {k:'stock', icon:'box', cls:'c-blue', label:t('tile_stock'), go:()=>{ S.stockSection='snacks'; location.hash='#stock'; }},
  ];
  if(hasBeer) tiles.push({k:'beer', icon:'beer', cls:'c-amber', label:t('tile_beer'), go:()=>{ S.stockSection='beer'; location.hash='#stock'; }});
  tiles.push({k:'equip', icon:'machine', cls:'c-grey', label:t('tile_equip'), go:()=>{ location.hash='#equip'; }});
  if(canManageStaff()){
    tiles.push({k:'approvals', icon:'users', cls:'c-purple', label:t('tile_approvals'), count:pendingCount, go:()=>{ location.hash='#me'; setTimeout(()=>{ const h=[...document.querySelectorAll('#view h2')].find(x=>x.textContent.includes(t('admin_pending_prefix').replace(/[（(].*$/,''))); if(h) h.scrollIntoView({behavior:'smooth'}); },300); }});
    tiles.push({k:'schedule', icon:'calendar', cls:'c-blue', label:t('tile_schedule'), go:()=>{ location.hash='#me'; setTimeout(()=>{ const h=[...document.querySelectorAll('#view h2')].find(x=>x.textContent.includes(t('admin_schedule_mgmt'))); if(h) h.scrollIntoView({behavior:'smooth'}); },300); }});
    tiles.push({k:'report', icon:'chart', cls:'c-green', label:t('tile_report'), go:()=>{ S.clockSub='report'; location.hash='#clock'; }});
    tiles.push({k:'staff', icon:'users', cls:'c-blue', label:t('tile_staff'), go:()=>{ location.hash='#me'; setTimeout(()=>{ const h=[...document.querySelectorAll('#view h2')].find(x=>x.textContent.includes(t('admin_staff_mgmt'))); if(h) h.scrollIntoView({behavior:'smooth'}); },300); }});
  }
  if(isAdmin()){
    tiles.push({k:'overview', icon:'check', cls:'c-green', label:t('tile_overview'), go:()=>{ S.taskBranch='__all__'; location.hash='#tasks'; }});
    tiles.push({k:'settings', icon:'gear', cls:'c-grey', label:t('tile_settings'), go:()=>{ location.hash='#me'; setTimeout(()=>{ const h=[...document.querySelectorAll('#view h2')].find(x=>x.textContent.includes(t('admin_settings'))); if(h) h.scrollIntoView({behavior:'smooth'}); },300); }});
  }
  tiles.push({k:'help', icon:'book', cls:'c-grey', label:t('tile_help'), go:()=>{ window.open(GUIDE_URL,'_blank','noopener'); }});
  const wrap=el('<div></div>');
  wrap.appendChild(secH('grid','c-blue',t('func_title')));
  const grid=el('<div class="fgrid"></div>');
  tiles.forEach(tl=>{
    const b=el(`<button class="ftile" type="button"><span class="bd">${ib(tl.icon, tl.cls, 'lg')}${tl.count?`<span class="cnt">${tl.count>99?'99+':tl.count}</span>`:''}</span><span class="lb">${esc(tl.label)}</span></button>`);
    b.onclick=tl.go; grid.appendChild(b);
  });
  wrap.appendChild(grid);
  return wrap;
}
function notifIcon(id){
  const p=String(id).split(':')[0];
  const map={memo:['megaphone','c-orange'], leave:['calendar','c-purple'], pending:['calendar','c-purple'], sched:['calendar','c-blue'], punch:['clock','c-amber'], ppunch:['clock','c-amber'], swap:['swap','c-amber'], pswap:['swap','c-amber'], fault:['wrench','c-orange'], keg:['beer','c-amber'], docexp:['users','c-purple'], temp:['thermo','c-teal'], sos:['siren','c-red'], inc:['alert','c-red'], safety:['siren','c-red']};
  const m=map[p]||['bell','c-grey'];
  return ib(m[0], m[1], 'sm');
}

/* ============================ START ============================ */
document.addEventListener('DOMContentLoaded', ()=>{
  S.tab=(location.hash||'#home').slice(1);
  boot();
});
})();
</script>
